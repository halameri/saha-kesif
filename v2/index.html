let idbP=null;const urlCache={};
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("sk2-foto",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("p",mode),st=t.objectStore("p"),r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const idbPut=(id,b)=>idbTx("readwrite",st=>st.put(b,id));
const idbGet=id=>idbTx("readonly",st=>st.get(id));
const idbDel=id=>{if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}return idbTx("readwrite",st=>st.delete(id)).catch(()=>{})};
async function urlOf(id){if(urlCache[id])return urlCache[id];try{const b=await idbGet(id);if(b)return urlCache[id]=URL.createObjectURL(b)}catch(e){}return ""}
async function hydrate(root=app){for(const img of root.querySelectorAll("img[data-pid]")){const u=await urlOf(img.dataset.pid);if(u&&img.getAttribute("src")!==u)img.src=u}}
function shrinkTo(blob,max,q){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(blob);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||blob),"image/jpeg",q)};img.onerror=()=>{URL.revokeObjectURL(u);res(blob)};img.src=u})}
function blobToImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=u})}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r("");f.readAsDataURL(b)});

/* survey helpers */
const A=(s,k)=>s.a?.[k]??"";
const V=(s,k)=>s.v?.[k]??"";
const shown=(s,it,sec)=>!(it.only&&it.only!==s.type)&&!(sec&&sec.only&&sec.only!==s.type);
function answered(s,it){const a=A(s,it.k);if(it.kind==="num")return a!==""&&a!=null;return !!a}
function progress(s){let t=0,d=0;for(const {sec,it} of ALL){if(!shown(s,it,sec))continue;t++;if(answered(s,it))d++}return{t,d}}
function areaOf(s,k){const e=num(V(s,k+".en")),b=num(V(s,k+".boy"));return e>0&&b>0?e*b:null}

/* =========================================================
   3. ENERGY CALCULATION
   ========================================================= */
function genStats(s){
  const gens=(A(s,"jen")==="yes"?(s.gens||[]):[]).map(g=>{const kva=num(g.kva),pct=num(g.pct);const free=kva!=null&&pct!=null?kva*(100-pct)/100:null;return{...g,kvaN:kva,pctN:pct,free}});
  const main=gens.filter(g=>g.role!=="Yedek"),use=main.length?main:gens;
  const known=use.filter(g=>g.free!=null);
  return{gens,count:gens.length,totalKva:gens.reduce((a,g)=>a+(g.kvaN||0),0),free:known.length?known.reduce((a,g)=>a+g.free,0):null,mainCount:main.length,backupCount:gens.length-main.length};
}
function energy(s){
  const L=s.load||{};
  const dcA=num(L.dcA)??25,hours=num(L.hours)??10,bt=BAT_TYPES[batKey(L.batType)],li=bt===BAT_TYPES.Lityum;
  const dod=bt.dod,aging=bt.aging,batLabel=bt.l;
  const battNeed=Math.ceil(dcA*hours/dod*aging/50)*50;
  const batt=num(L.batt)||battNeed;
  const backupReal=batt*dod/aging/dcA;
  const dcW=dcA*DCV,rectW=dcW/EFF,chgA=batt*CH,chgW=chgA*DCV/EFF;
  const cc=coolCfg(L);let mode=cc.mode;if(mode==="auto")mode=A(s,"sogutma")==="Yeni split klima gerekli"?"klima":"yok";
  let splitW=0,coolDesc="dahil değil";
  if(mode==="klima"){const t=AC_TYPES[cc.type]||AC_TYPES.split,unitW=cc.btu/t.eer;splitW=unitW*cc.run;
    coolDesc=`${cc.total>1?cc.total+" × ":""}${fmt(cc.btu,0)} BTU ${t.l.split(" (")[0].toLowerCase()}${cc.total>cc.run?` (${cc.run} çalışan, ${cc.total-cc.run} yedek)`:cc.run>1?` (${cc.run} çalışan)`:""}`}
  else if(mode==="kat"){splitW=rectW*cc.mult;coolDesc=`sistem yükünün ${fmt(cc.mult)} katı`}
  else if(mode==="manuel"&&cc.amps!=null){splitW=cc.amps*220;coolDesc=`elle girilen ${fmt(cc.amps)} A`}
  const splitOn=splitW>0;
  const normalW=rectW+splitW,peakW=rectW+chgW+splitW;
  const A220=peakW/220,kVA=peakW/1000/PF,phase=peakW/(1.732*380);
  const breaker=BREAKERS.find(b=>b>=A220*1.25)||Math.ceil(A220*1.25);
  const worst=num(A(s,"enuzun"))??num(A(s,"kesinti"));
  const worstSrc=num(A(s,"enuzun"))!=null?"en uzun tek kesinti":"günlük kesinti";
  const g=genStats(s);
  return{dcA,hours,li,batLabel,batt,battNeed,backupReal,splitOn,coolDesc,coolMode:mode,splitW,dcW,rectW,chgA,chgW,normalW,peakW,A220,kVA,phase,breaker,worst,worstSrc,
    backupOk:worst==null?null:worst<=hours,genOk:g.free==null?null:g.free>=kVA,genFree:g.free};
}

function siteSummary(s){
  const P=[],name=s.name||"Saha",tt=s.type==="tt";
  P.push(`${name}${s.gov?` (${s.gov})`:""} ${s.date?fmtDate(s.date)+" tarihinde ":""}ziyaret edilmiştir.${s.type?` Saha ${tt?"yeni bir TT santrali kurulması planlanan bir lokasyondur":"mevcut bir İTPC santralidir; binada şebeke elektriği bulunmaktadır"}.`:""}`);
  const sal=A(s,"salon"),bos=A(s,"salonBos"),oda=A(s,"oda"),ba=areaOf(s,"salonBos"),oa=areaOf(s,"oda");
  if(sal==="yes"){let t="Sahada hazır bir sistem salonu bulunmaktadır";
    if(bos==="yes")t+=`; salonda tarafımıza verilebilecek boş alan mevcuttur${ba?` (yaklaşık ${fmt(ba,0)} m²)`:""}`;
    else if(bos==="no")t+=", ancak salonda tarafımıza ayrılabilecek boş alan bulunmamaktadır";
    else if(bos==="unk")t+="; salonda bize alan verilip verilemeyeceği henüz netleşmemiştir";
    P.push(t+".")}
  else if(sal==="no")P.push("Sahada hazır bir sistem salonu bulunmamaktadır.");
  else if(bos==="yes")P.push(`Sistem salonunda tarafımıza verilebilecek boş alan mevcuttur${ba?` (yaklaşık ${fmt(ba,0)} m²)`:""}.`);
  if(oda==="yes")P.push(`Ayrıca kullanılabilecek ayrı bir boş oda vardır${oa?` (yaklaşık ${fmt(oa,0)} m²)`:""}.`);
  else if(oda==="no")P.push("Ayrı bir boş oda bulunmamaktadır.");
  if(tt){const k=A(s,"kont"),ka=areaOf(s,"kont");
    if(k==="yes")P.push(`Konteyner veya kabin için uygun bir alan mevcuttur${ka?` (yaklaşık ${fmt(ka,0)} m²)`:""}.`);else if(k==="no")P.push("Konteyner veya kabin için uygun bir alan görülmemiştir.");
    const d=A(s,"direk"),m=num(V(s,"direk.m"));
    if(d==="yes")P.push(`En yakın elektrik direği ${m!=null?`binaya yaklaşık ${fmt(m,0)} m uzaklıktadır`:"sahanın yakınındadır"}${A(s,"trafo")==="yes"?" ve yakında bir trafo bulunmaktadır":""}.`);
    else if(d==="no")P.push("Sahanın yakınında elektrik direği bulunmamaktadır.");}
  const k=num(A(s,"kesinti")),en=num(A(s,"enuzun")),du=A(s,"duzen");
  if(k===0)P.push("Bölgede elektrik kesintisi yok denecek kadar azdır.");
  else if(k!=null){let t=`Elektrik en kötü durumda günde yaklaşık ${fmt(k)} saat kesilmektedir`;
    if(du==="Programlı")t+=" ve kesintiler belirli bir programa göre yapılmaktadır";
    else if(du==="Rastgele")t+=" ve kesintiler belirli bir programa bağlı olmadan, rastgele gerçekleşmektedir";
    else if(du==="Karışık")t+="; kesintilerin bir kısmı programlı, bir kısmı rastgeledir";
    if(en!=null)t+=`. En uzun tek kesinti yaklaşık ${fmt(en)} saat sürmektedir`;
    P.push(t+".")}
  else if(du&&du!=="Bilinmiyor")P.push(`Elektrik kesintileri ${du==="Programlı"?"programlı":du==="Rastgele"?"rastgele":"kısmen programlı, kısmen rastgele"} gerçekleşmektedir.`);
  const so=A(s,"sogutma");
  if(so==="Mevcut soğutma kullanılabilir")P.push("Ekipmanlarımızın soğutulması için sahadaki mevcut soğutma sisteminin kullanılabileceği görülmüştür.");
  else if(so==="Yeni split klima gerekli")P.push("Ekipmanlarımızın soğutulması için yeni bir split klima eklenmesi gerekmektedir.");
  else if(so==="Bilinmiyor")P.push("Soğutmanın nasıl sağlanacağı henüz netleşmemiştir.");
  const j=A(s,"jen"),g=genStats(s);
  if(j==="no")P.push("Sahada jeneratör bulunmamaktadır.");
  else if(j==="yes"){
    if(g.count){const parts=g.gens.map(x=>`${x.kvaN!=null?fmt(x.kvaN,0)+" kVA":"gücü bilinmeyen"} ${x.role==="Yedek"?"yedek":"asıl"} jeneratör${x.pctN===0?" (şu an boşta)":x.pctN!=null?` (yaklaşık %${fmt(x.pctN,0)} yüklü)`:""}`);
      P.push(`Sahada ${g.count} adet jeneratör bulunmaktadır: ${parts.join(", ")}.`);
      if(g.free!=null)P.push(`${g.mainCount&&g.backupCount?"Asıl jeneratörlerde":"Jeneratörlerde"} yaklaşık ${fmt(g.free,0)} kVA boş kapasite bulunmaktadır.`)}
    else P.push("Sahada jeneratör bulunmaktadır; kapasite bilgisi alınamamıştır.")}
  else if(j==="unk")P.push("Sahada jeneratör olup olmadığı netleştirilememiştir.");
  if(s.load?.on){const e=energy(s);
    P.push(`Bu lokasyonda öngörülen ${fmt(e.dcA)} A (-48 V DC) yükümüz, akü şarjı${e.splitOn?" ve soğutma":""} ile birlikte en kötü durumda yaklaşık ${fmt(e.peakW/1000)} kW (220 V'ta yaklaşık ${fmt(e.A220,0)} A, ${fmt(e.kVA)} kVA) güç gerektirmektedir; güvenlik payıyla ${e.breaker} A besleme talep edilmelidir.`);
    if(e.genOk===true)P.push("Jeneratörlerin boş kapasitesi bu ihtiyacı karşılamaya yeterli görünmektedir.");
    else if(e.genOk===false)P.push("Jeneratörlerin boş kapasitesi bu ihtiyaç için yetersiz görünmektedir.");
    if(e.backupOk===false)P.push(`${e.worstSrc==="en uzun tek kesinti"?"En uzun tek kesinti":"Günlük kesinti süresi"} (${fmt(e.worst)} saat) ${fmt(e.hours,0)} saatlik akü yedeklemesini aştığından jeneratör desteği gereklidir.`);
    else if(e.backupOk===true&&e.worst>0)P.push(`Kesinti süresi ${fmt(e.hours,0)} saatlik akü yedeklemesi ile karşılanabilmektedir.`);}
  return P.join(" ");
}
function overallSummary(list,label){
  if(!list.length)return "";
  const P=[],n=list.length;
  P.push(`Bu rapor, ${label} ziyaret edilen ${n} sahanın enerji açısından mevcut durumunu özetlemektedir (${list.map(s=>s.name||"Adsız saha").join(", ")}).`);
  const it=list.filter(s=>s.type==="itpc").length,tt=list.filter(s=>s.type==="tt").length;
  if(it&&tt)P.push(`Sahaların ${it} tanesi mevcut İTPC santrali, ${tt} tanesi yeni TT santrali lokasyonudur.`);
  else if(it)P.push(n>1?"Sahaların tamamı mevcut İTPC santralidir.":"Saha mevcut bir İTPC santralidir.");
  else if(tt)P.push(n>1?"Sahaların tamamı yeni TT santrali lokasyonudur.":"Saha yeni bir TT santrali lokasyonudur.");
  const cnt=k=>list.filter(s=>A(s,k)==="yes").length;
  const a=cnt("salonBos"),o=cnt("oda");
  if(a||o)P.push(`${a?`${a} sahada sistem salonunda tarafımıza verilebilecek boş alan`:""}${a&&o?", ":""}${o?`${o} sahada ayrı boş oda`:""} bulunmaktadır.`);
  const ks=list.map(s=>({s,k:num(A(s,"kesinti"))})).filter(x=>x.k!=null);
  if(ks.length){const mx=ks.reduce((p,c)=>c.k>p.k?c:p),mn=Math.min(...ks.map(x=>x.k));
    P.push(ks.length>1&&mx.k!==mn?`En kötü durumdaki günlük elektrik kesintisi sahalara göre ${fmt(mn)} ile ${fmt(mx.k)} saat arasında değişmektedir; en uzun kesinti ${mx.s.name||"bir"} sahasındadır.`:`En kötü durumdaki günlük elektrik kesintisi yaklaşık ${fmt(mx.k)} saattir.`)}
  const sp=list.filter(s=>A(s,"sogutma")==="Yeni split klima gerekli").length,ex=list.filter(s=>A(s,"sogutma")==="Mevcut soğutma kullanılabilir").length;
  if(ex&&sp)P.push(`${ex} sahada mevcut soğutma kullanılabilecekken ${sp} sahada yeni split klima gerekmektedir.`);
  else if(sp)P.push(`${sp===n?"Tüm sahalarda":`${sp} sahada`} yeni split klima gerekmektedir.`);
  else if(ex)P.push(`${ex===n?"Tüm sahalarda":`${ex} sahada`} mevcut soğutma kullanılabilecektir.`);
  const gj=list.filter(s=>A(s,"jen")==="yes").length;
  if(gj)P.push(`${gj===n?"Tüm sahalarda":`${gj} sahada`} jeneratör bulunmaktadır.`);
  const en=list.filter(s=>s.load?.on).map(s=>({s,e:energy(s)}));
  if(en.length){const ws=en.map(x=>x.e.peakW/1000),bs=[...new Set(en.map(x=>x.e.breaker))];
    P.push(`Enerji hesabı yapılan sahalarda ihtiyacımız saha başına en kötü durumda yaklaşık ${fmt(Math.min(...ws))}${Math.max(...ws)-Math.min(...ws)>0.05?`–${fmt(Math.max(...ws))}`:""} kW olup ${bs.length===1?`${bs[0]} A`:`${Math.min(...bs)}–${Math.max(...bs)} A`} besleme talep edilmektedir.`);
    const over=en.filter(x=>x.e.backupOk===false).map(x=>x.s.name);
    if(over.length)P.push(`${over.join(", ")} ${over.length>1?"sahalarında":"sahasında"} kesinti süresi akü yedeklemesini aştığı için jeneratör desteği gereklidir.`);
    const weak=en.filter(x=>x.e.genOk===false).map(x=>x.s.name);
    if(weak.length)P.push(`${weak.join(", ")} ${weak.length>1?"sahalarında":"sahasında"} jeneratörlerin boş kapasitesi yetersiz görünmektedir.`);}
  return P.join(" ");
}

function genTotText(g){return `${g.count} jeneratör${g.backupCount?` (${g.mainCount} asıl, ${g.backupCount} yedek)`:""} · toplam ${fmt(g.totalKva,0)} kVA${g.free!=null?` · ${g.backupCount&&g.mainCount?"asıl ":""}boş kapasite ≈ ${fmt(g.free,0)} kVA`:""}`}

   <tr><td>Normal çalışma (akü dolu)</td><td>${fmt(e.normalW/1000)} kW · ${fmt(e.normalW/220)} A</td></tr>
   <tr class="tot"><td>En kötü durum (şarj + klima)</td><td>${fmt(e.peakW/1000)} kW · ${fmt(e.A220)} A · ${fmt(e.kVA)} kVA</td></tr>
   <tr class="tot"><td>Talep (güvenlik payıyla)</td><td>${e.breaker} A · 220 V</td></tr>

function coordHint(){const c=parseCoord(cur.coord);return c?`<a href="https://www.google.com/maps?q=${c[0]},${c[1]}" target="_blank" rel="noopener">Haritada aç</a>`:"İnternet gerekmez."}
function refreshSummary(){if(!cur.summaryEdited){cur.summary=siteSummary(cur);const t=app.querySelector("#sumTxt");if(t&&document.activeElement!==t)t.value=cur.summary}}
function refreshCounts(){const p=progress(cur);const tp=app.querySelector("#tProg");if(tp)tp.textContent=`${p.d}/${p.t} soru`;
  for(const sec of SEC){const el=app.querySelector("#c-"+sec.id);if(!el)continue;const its=sec.items.filter(it=>shown(cur,it,sec));el.textContent=`${its.filter(it=>answered(cur,it)).length}/${its.length}`}}
function refreshEnergy(){const o=app.querySelector("#energyOut");if(o)o.innerHTML=energyOutHtml(energy(cur))}
function rerenderItem(k){const {sec,it}=ALL.find(x=>x.it.k===k);const el=app.querySelector(`.item[data-item="${k}"]`);if(el){el.outerHTML=itemHtml(sec,it);hydrate()}}
function addGen(){cur.gens.push({id:uid(),kva:"",pct:"",role:cur.gens.length?"Yedek":"Asıl",note:""});rerenderItem("jen");dirty();const l=app.querySelectorAll(".gen");l[l.length-1]?.querySelector("input")?.focus()}
function askDelete(){const z=app.querySelector("#delZone");z.innerHTML=`<div class="confirm"><b>Bu keşif kalıcı olarak silinsin mi?</b><div class="row"><button class="btn danger" id="delY">Evet, sil</button><button class="btn" id="delN">Vazgeç</button></div></div>`;
  z.querySelector("#delN").onclick=()=>{z.innerHTML=`<button class="btn ghost danger sm" id="del">Bu keşfi sil</button>`;z.querySelector("#del").onclick=askDelete};
  z.querySelector("#delY").onclick=()=>{clearTimeout(saveT);saveT=null;for(const arr of Object.values(cur.photos||{}))for(const p of arr){idbDel(p.id);if(p.orig)idbDel(p.orig)}delete surveys[cur.id];saveAll();toast("Keşif silindi");renderList()}}

/* events */
function appendNote(old,t){old=(old||"").trim();if(old.includes(t))return old;return old?old.replace(/[.\s]*$/,"")+". "+t:t}
function onInput(e){
  const el=e.target;
  if(view==="report"){reportInput(e);return}
  if(!cur||view!=="editor")return;
  if(el.dataset.m){cur[el.dataset.m]=el.value;if(el.dataset.m==="name")app.querySelector("#tName").textContent=el.value||"Yeni saha";if(el.dataset.m==="coord")app.querySelector("#coordHint").innerHTML=coordHint();refreshSummary();dirty();return}
  if(el.dataset.num){cur.a[el.dataset.num]=el.value.trim();refreshCounts();refreshSummary();refreshEnergy();dirty();return}
  if(el.dataset.v){cur.v[el.dataset.v]=el.value;const k=el.dataset.v.split(".")[0];const ar=app.querySelector("#ar-"+k);if(ar){const a=areaOf(cur,k);ar.textContent=a?`≈ ${fmt(a,0)} m²`:""}refreshSummary();dirty();return}
  if(el.dataset.note){if(el.dataset.note==="__gen")cur.genNote=el.value;else cur.n[el.dataset.note]=el.value;dirty();return}
  if(el.dataset.g){const id=el.closest("[data-gen]").dataset.gen,g=cur.gens.find(x=>x.id===id);g[el.dataset.g]=el.value;
    const st=genStats(cur);const box=el.closest(".gen").querySelector("[data-gcalc]");box.innerHTML=genCalcText(st.gens[cur.gens.indexOf(g)]);const tt=app.querySelector("#genTot");if(tt)tt.textContent=genTotText(st);
    refreshSummary();refreshEnergy();dirty();return}
  if(el.id==="loadOn"){cur.load.on=el.checked;app.querySelector("#loadBox").hidden=!el.checked;refreshSummary();dirty();return}
  if(el.dataset.l){cur.load[el.dataset.l]=el.value;
    if(["coolMode","acType","btu"].includes(el.dataset.l)&&e.type==="change"){const cb=app.querySelector("#coolBox");if(cb)cb.innerHTML=coolHtml()}
    refreshEnergy();refreshSummary();dirty();return}
  if(el.id==="sumTxt"){cur.summary=el.value;cur.summaryEdited=true;app.querySelector("#sumState").textContent="Elle düzenlendi";dirty();return}
  if(el.dataset.up&&e.type==="change"){addPhotos(el.dataset.up,[...el.files]);el.value=""}
}
function onClick(e){
  const b=e.target.closest("button,img[data-open]");if(!b||!cur||view!=="editor")return;
  if(b.dataset.open!==undefined){openViewer(b.dataset.open,+b.dataset.i);return}
  if(b.dataset.type){cur.type=b.dataset.type;refreshSummary();dirty();renderEditor();return}
  if(b.dataset.ans){const k=b.dataset.ans,v=b.dataset.val;cur.a[k]=cur.a[k]===v?"":v;rerenderItem(k);refreshCounts();refreshSummary();refreshEnergy();dirty();return}
  if(b.dataset.addnote){const key=b.dataset.addnote,ta=document.createElement("textarea");ta.dataset.note=key;ta.placeholder="Not";b.replaceWith(ta);ta.focus();return}
  if(b.dataset.qn){const key=b.dataset.qn,t=b.dataset.txt;let val;
    if(key==="__gen"){cur.genNote=appendNote(cur.genNote,t);val=cur.genNote}else{cur.n[key]=appendNote(cur.n[key],t);val=cur.n[key]}
    const scope=key==="__gen"?app.querySelector('[aria-label="Özet"]'):app.querySelector(`.item[data-item="${key}"]`);
    let ta=scope.querySelector(`textarea[data-note="${key}"]`);if(!ta){ta=document.createElement("textarea");ta.dataset.note=key;scope.querySelector(`[data-addnote="${key}"]`)?.replaceWith(ta)}
    ta.value=val;b.classList.add("used");dirty();return}
  if(b.dataset.grole){const id=b.closest("[data-gen]").dataset.gen,g=cur.gens.find(x=>x.id===id);g.role=b.dataset.grole;rerenderItem("jen");refreshSummary();refreshEnergy();dirty();return}
  if(b.dataset.gqn){const id=b.closest("[data-gen]").dataset.gen,g=cur.gens.find(x=>x.id===id);g.note=appendNote(g.note,b.dataset.gqn);b.closest(".gen").querySelector('[data-g="note"]').value=g.note;b.classList.add("used");dirty();return}
  if(b.dataset.delgen){if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Emin misin?";return}
    const id=b.dataset.delgen;for(const p of photos(cur,"gen-"+id))idbDel(p.id);delete cur.photos["gen-"+id];cur.gens=cur.gens.filter(x=>x.id!==id);rerenderItem("jen");refreshSummary();refreshEnergy();dirty();return}
  if(b.id==="addGen"){addGen();return}
}

/* photos */
async function addPhotos(g,files){
  for(const f of files){try{toast("Fotoğraf kaydediliyor…");const blob=await shrinkTo(f,1600,.82);const id=uid();await idbPut(id,blob);urlCache[id]=URL.createObjectURL(blob);(cur.photos[g]=cur.photos[g]||[]).push({id,cap:""});dirty()}catch(e){toast("Fotoğraf kaydedilemedi (hafıza dolu olabilir)")}}

}

/* annotation editor: pen, arrow, circle, rectangle, text */
async function openAnnotator(g,i){
  const p=photos(cur,g)[i];const base=await blobToImg(await idbGet(p.orig||p.id));
  const k=Math.min(1,1600/Math.max(base.width,base.height));const W=Math.round(base.width*k),H=Math.round(base.height*k);
  ov.innerHTML=`<div class="ov"><div class="bar">
    ${[["pen","✏️ Kalem"],["arrow","➜ Ok"],["circle","◯ Daire"],["rect","▭ Kutu"],["text","T Yazı"]].map(([t,l])=>`<button class="btn${t==="arrow"?" on":""}" data-tool="${t}">${l}</button>`).join("")}
   </div><div class="stage" id="stage"><canvas id="cv" width="${W}" height="${H}"></canvas></div>
   <div class="bar">${["#e8262a","#ffd400","#ffffff","#1e90ff"].map((c,j)=>`<button class="sw${j===0?" on":""}" data-col="${c}" style="background:${c}" aria-label="Renk"></button>`).join("")}
    <button class="btn" id="aUndo">↶ Geri al</button><button class="btn" id="aCancel">Vazgeç</button><button class="btn on" id="aSave" style="margin-left:auto">✓ Kaydet</button></div></div>`;
  const cv=ov.querySelector("#cv"),ctx=cv.getContext("2d");let tool="arrow",col="#e8262a";const shapes=[];let curS=null;
  const lw=Math.max(4,Math.round(Math.max(W,H)/220));
  function draw(){ctx.drawImage(base,0,0,W,H);for(const s of shapes.concat(curS?[curS]:[]))drawShape(s)}
  function drawShape(s){ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";
    if(s.t==="pen"){ctx.beginPath();s.pts.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
    else if(s.t==="arrow"){const {x1,y1,x2,y2}=s,a=Math.atan2(y2-y1,x2-x1),h=lw*4.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45));ctx.lineTo(x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45));ctx.closePath();ctx.fill()}
    else if(s.t==="circle"){ctx.beginPath();ctx.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.abs(s.x2-s.x1)/2,Math.abs(s.y2-s.y1)/2,0,0,Math.PI*2);ctx.stroke()}
    else if(s.t==="rect"){ctx.strokeRect(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.abs(s.x2-s.x1),Math.abs(s.y2-s.y1))}
    else if(s.t==="text"){const fs=Math.round(Math.max(W,H)/28);ctx.font=`bold ${fs}px -apple-system,system-ui,Arial,sans-serif`;ctx.lineWidth=Math.max(3,fs/7);ctx.strokeStyle=s.c==="#ffffff"||s.c==="#ffd400"?"#000":"#fff";ctx.strokeText(s.txt,s.x1,s.y1);ctx.fillText(s.txt,s.x1,s.y1)}}
  const pos=ev=>{const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height]};
  cv.addEventListener("pointerdown",ev=>{ev.preventDefault();const [x,y]=pos(ev);
    if(tool==="text"){askText(x,y);return}
    cv.setPointerCapture(ev.pointerId);curS=tool==="pen"?{t:"pen",c:col,pts:[[x,y]]}:{t:tool,c:col,x1:x,y1:y,x2:x,y2:y};draw()});
  cv.addEventListener("pointermove",ev=>{if(!curS)return;const [x,y]=pos(ev);if(curS.t==="pen")curS.pts.push([x,y]);else{curS.x2=x;curS.y2=y}draw()});
  const up=()=>{if(!curS)return;if(curS.t==="pen"?curS.pts.length>1:Math.hypot(curS.x2-curS.x1,curS.y2-curS.y1)>8)shapes.push(curS);curS=null;draw()};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  function askText(x,y){const bar=document.createElement("div");bar.className="bar";bar.innerHTML=`<input class="cap" id="tIn" placeholder="Yazı (ör. Bize verilecek alan)"><button class="btn on" id="tOk">Ekle</button>`;
    ov.querySelector(".ov").insertBefore(bar,ov.querySelector("#stage"));const inp=bar.querySelector("#tIn");inp.focus();
    bar.querySelector("#tOk").onclick=()=>{if(inp.value.trim())shapes.push({t:"text",c:col,x1:x,y1:y,txt:inp.value.trim()});bar.remove();draw()}}
  ov.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;ov.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b));if(tool==="text")toast("Yazının başlayacağı yere dokun")});
  ov.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{col=b.dataset.col;ov.querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b))});
  ov.querySelector("#aUndo").onclick=()=>{shapes.pop();draw()};
  ov.querySelector("#aCancel").onclick=()=>openViewer(g,i);
  ov.querySelector("#aSave").onclick=async()=>{if(!shapes.length){openViewer(g,i);return}
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));const id=uid();await idbPut(id,blob);urlCache[id]=URL.createObjectURL(blob);
    if(p.orig)idbDel(p.id);else p.orig=p.id;p.id=id;dirty();toast("İşaretli fotoğraf kaydedildi");openViewer(g,i)};
  draw();
}

   e=>toast(e.code===1?"Konum izni yok: Ayarlar › Gizlilik › Konum Servisleri › Safari Web Siteleri":"Konum alınamadı, tekrar dene"),{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}
async function makeMapImage(lat,lon,z,label){
  const W=1000,H=700,n=2**z,lr=lat*Math.PI/180;
  const cx=(lon+180)/360*n*256,cy=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n*256,x0=cx-W/2,y0=cy-H/2;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.fillStyle="#e8e6e1";g.fillRect(0,0,W,H);
  const jobs=[];
  for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+H)/256);ty++){if(ty<0||ty>=n)continue;const X=((tx%n)+n)%n;
    jobs.push(fetch(`https://tile.openstreetmap.org/${z}/${X}/${ty}.png`).then(r=>{if(!r.ok)throw new Error("tile");return r.blob()}).then(b=>createImageBitmap(b)).then(im=>g.drawImage(im,Math.round(tx*256-x0),Math.round(ty*256-y0))))}
  await Promise.all(jobs);
  const mx=W/2,my=H/2;g.beginPath();g.arc(mx,my,46,0,2*Math.PI);g.strokeStyle="rgba(210,34,34,.55)";g.lineWidth=5;g.stroke();
  g.beginPath();g.moveTo(mx,my);g.bezierCurveTo(mx-26,my-30,mx-22,my-60,mx,my-60);g.bezierCurveTo(mx+22,my-60,mx+26,my-30,mx,my);g.closePath();g.fillStyle="#d22";g.fill();g.lineWidth=4;g.strokeStyle="#fff";g.stroke();
  g.beginPath();g.arc(mx,my-40,8,0,2*Math.PI);g.fillStyle="#fff";g.fill();
  const t1=label||"",t2=`${lat.toFixed(6)}, ${lon.toFixed(6)}`;const F="-apple-system,system-ui,Arial,sans-serif";
  g.font=`bold 26px ${F}`;const w1=g.measureText(t1).width;g.font=`20px ${F}`;const w2=g.measureText(t2).width;
  g.fillStyle="rgba(255,255,255,.92)";g.fillRect(12,12,Math.max(w1,w2)+28,t1?76:44);g.fillStyle="#1c2730";if(t1){g.font=`bold 26px ${F}`;g.fillText(t1,26,46)}g.font=`20px ${F}`;g.fillText(t2,26,t1?76:42);
  const at="© OpenStreetMap contributors";g.font=`15px ${F}`;const aw=g.measureText(at).width;g.fillStyle="rgba(255,255,255,.85)";g.fillRect(W-aw-18,H-26,aw+18,26);g.fillStyle="#333";g.fillText(at,W-aw-9,H-8);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85));
}

/* =========================================================
   8. PDF (drawn on canvas pages, written as PDF – works offline)
   ========================================================= */
const PW=1240,PH=1754,PM=96,CW=PW-2*PM,FONT="-apple-system,system-ui,'Segoe UI',Arial,sans-serif";
const C={navy:"#1c3d5a",ink:"#1c2730",muted:"#5b6b78",line:"#c9d2d9",zebra:"#f4f6f8",head:"#e8eef3",bad:"#fbe9e5",ok:"#e4f3ea",soft:"#f5f7f9"};
class Doc{
  constructor(title){this.title=title;this.jpegs=[];this.n=0;this.page()}
  page(){if(this.cv)this.finish();this.n++;const c=document.createElement("canvas");c.width=PW;c.height=PH;this.cv=c;this.g=c.getContext("2d");this.g.fillStyle="#fff";this.g.fillRect(0,0,PW,PH);this.y=PM;this.g.textBaseline="alphabetic"}
  finish(){const g=this.g;g.fillStyle=C.muted;g.font=`20px ${FONT}`;g.textAlign="left";g.fillText(this.title,PM,PH-52);g.textAlign="right";g.fillText(`Sayfa ${this.n}`,PW-PM,PH-52);g.textAlign="left";
    g.strokeStyle=C.line;g.lineWidth=1.5;g.beginPath();g.moveTo(PM,PH-80);g.lineTo(PW-PM,PH-80);g.stroke();
    const cv=this.cv;this.jpegs.push(new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",.84)));this.cv=null}
  room(h){return this.y+h<=PH-PM-10}
  need(h){if(!this.room(h))this.page()}
  font(sz,bold){return `${bold?"bold ":""}${sz}px ${FONT}`}
  wrap(text,sz,bold,w){const g=this.g;g.font=this.font(sz,bold);const out=[];for(const para of String(text??"").split("\n")){let line="";for(const word of para.split(/\s+/)){const t=line?line+" "+word:word;if(g.measureText(t).width>w&&line){out.push(line);line=word}else line=t}out.push(line)}return out}
  text(t,{sz=24,bold=false,color=C.ink,lh=1.45,gap=14,x=PM,w=CW}={}){const lines=this.wrap(t,sz,bold,w),h=sz*lh;for(const l of lines){this.need(h);this.g.font=this.font(sz,bold);this.g.fillStyle=color;this.g.fillText(l,x,this.y+sz);this.y+=h}this.y+=gap}

async function pdfFromJpegs(blobs){
  const enc=new TextEncoder(),parts=[];let off=0;const offs=[];
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);off+=b.length};
  const obj=(id,body)=>{offs[id]=off;push(`${id} 0 obj\n`);if(typeof body==="string")push(body);else body();push("\nendobj\n")};
  push("%PDF-1.4\n");push(new Uint8Array([37,226,227,207,211,10]));
  const n=blobs.length,kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>`);
  for(let i=0;i<n;i++){const pid=3+i*3,cid=pid+1,iid=pid+2;const bytes=new Uint8Array(await blobs[i].arrayBuffer());
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);push(bytes);push("\nendstream")})}
  const total=3+n*3,xo=off;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}

function anchorSave(b,filename){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function saveFile({filename,data,blob,type,onDone}){
  const mime=type||"text/plain",b=blob||new Blob([data],{type:mime+";charset=utf-8"});
  let file=null;try{file=new File([b],filename,{type:mime})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){const sh=document.getElementById("sheet");document.getElementById("shName").textContent=`${filename} (${fmt(b.size/1048576)} MB)`;sh.hidden=false;
    document.getElementById("shX").onclick=()=>sh.hidden=true;
    document.getElementById("shGo").onclick=()=>{navigator.share({files:[file],title:filename}).then(()=>{sh.hidden=true;onDone&&onDone()}).catch(e=>{if(e&&e.name!=="AbortError")anchorSave(b,filename)})};return}
  anchorSave(b,filename);toast("Dosya hazır");onDone&&onDone()}

async function restore(file){
  try{const d=JSON.parse(await file.text());
    if(d.app==="saha-kesif"){const r=await importV1(d.surveys,async id=>{const u=d.photos?.[id];return u?await (await fetch(u)).blob():null});renderList();toast(r.n?`Eski sürümden ${r.n} keşif aktarıldı`:"Yeni aktarılacak kayıt yok");return}

  const map=[["alan.oda","salon"],["alan.bosalan","salonBos"],["alan.bosoda","oda"],["sebeke.direk","direk"],["sebeke.trafo","trafo"]];
  for(const [o1,k] of map){if(ans(o1))s.a[k]=ans(o1);if(it(o1).n)s.n[k]=it(o1).n}
  if(it("sebeke.direk").v?.mesafe)s.v["direk.m"]=it("sebeke.direk").v.mesafe;
  const sa=num(it("sebeke.saat").v?.saat);
  if(sa!=null&&sa<=24){s.a.kesinti=String(24-sa);s.n.kesinti=appendNote(it("sebeke.saat").n,`Eski kayıttan: günde ~${fmt(sa)} saat elektrik var bilgisinden hesaplandı`)}
  else if(it("sebeke.saat").n)s.n.kesinti=it("sebeke.saat").n;
  const j=it("mevcut.jen");
  if(ans("mevcut.jen")){s.a.jen=ans("mevcut.jen");if(j.n)s.n.jen=j.n;
    if(s.a.jen==="yes"&&j.v&&(j.v.kva||j.v.cap)){const cap=num(j.v.cap),used=num(j.v.used);
      s.gens.push({id:uid(),kva:j.v.kva||"",pct:cap&&used!=null?String(Math.round(used/cap*100)):"",role:"Asıl",
        note:[j.v.sahip,j.v.saat?`günde ~${j.v.saat} saat çalışıyor`:"",cap?`toplam ${cap} A, kullanılan ${used??"?"} A`:""].filter(Boolean).join(" · ")})}}
  const extra=[];
  if(o.desc)extra.push(`Saha tanımı: ${o.desc}`);
  for(const [k,label] of Object.entries(V1_LABEL)){if(["alan.oda","alan.bosalan","alan.bosoda","sebeke.direk","sebeke.trafo","sebeke.saat","mevcut.jen"].includes(k))continue;
    const e=it(k);const a=ans(k),vals=Object.entries(e.v||{}).filter(([,x])=>String(x).trim()).map(([kk,x])=>kk==="tip"||kk==="ad"?String(x):`${({mesafe:"mesafe",kva:"güç (kVA)",en:"en",boy:"boy",saat:"saat",adet:"adet"})[kk]||kk} ${x}`);
    if(!a&&!vals.length&&!e.n)continue;
    extra.push(`${label}: ${[a?({yes:"Evet",no:"Hayır",unk:"Bilinmiyor"})[a]:"",vals.join(", "),e.n].filter(Boolean).join(" – ")}`)}
  if(o.general)extra.push(o.general);
  if(extra.length)s.genNote=["Eski sürümden aktarılan bilgiler:",...extra].join("\n");
  return s;
}
async function importV1(data,photoSrc){
  let n=0,ph=0;
  for(const o of Object.values(data||{})){
    if(!o||!o.id||surveys["v1-"+o.id])continue;
    const s=convertV1(o);
    for(const [g,arr] of Object.entries(o.photos||{})){
      let [tg,label]=V1_GROUP[g]||["genel",V1_LABEL[g.replace("-",".")]||""];
      if(g==="mevcut-jen"){if(s.gens[0])tg="gen-"+s.gens[0].id;else{tg="genel";label="Jeneratör"}}
      for(const p of arr||[]){try{const b=await photoSrc(p.id);if(!b)continue;await idbPut(p.id,b);(s.photos[tg]=s.photos[tg]||[]).push({id:p.id,cap:label});ph++}catch(e){}}
    }
    surveys[s.id]=s;n++;
  }
  saveAll();return{n,ph};
}
function v1LocalPhoto(id){return new Promise(res=>{try{const r=indexedDB.open("saha-kesif-foto",1);r.onupgradeneeded=()=>{r.transaction.abort();res(null)};r.onerror=()=>res(null);
  r.onsuccess=()=>{try{const t=r.result.transaction("p","readonly").objectStore("p").get(id);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}}}catch(e){res(null)}})}
async function migrateLocal(){
  const old=lsGet("saha-kesif",null);
  const list=Object.values(old||{}).filter(o=>o&&o.id&&!o.example);
  if(!list.length)return null;
  toast("Eski kayıtlar aktarılıyor…",6000);
  return await importV1(Object.fromEntries(list.map(o=>[o.id,o])),v1LocalPhoto);
}
function renderImport(){
  view="import";cur=null;
  app.innerHTML=`<div class="topbar"><button class="btn ghost" id="back" aria-label="Geri">←</button><div class="title"><b>Eski sürümden aktar</b><span>Saha Keşfi 1 kayıtları</span></div></div>
  <section class="panel"><b>1. Yol: Bu telefondan doğrudan</b><span class="hint">Eski uygulamanın kayıtları bu uygulamadan okunabiliyorsa tek dokunuşla aktarılır.</span><div class="row"><button class="btn primary" id="imLocal">Eski kayıtları ara ve aktar</button></div><div id="imRes" class="hint"></div></section>
  <section class="panel"><b>2. Yol: Yedek dosyasıyla (her zaman çalışır)</b>
   <ol style="margin:0;padding-left:20px;display:grid;gap:4px"><li>Eski uygulamayı (Saha Keşfi) aç, ana ekranın altındaki <b>Yedek al</b>'a bas.</li><li>Paylaş menüsünden <b>Dosyalara Kaydet</b>'i seç.</li><li>Buraya dön ve aşağıdaki düğmeyle o dosyayı seç.</li></ol>
   <div class="row"><label class="btn primary upload" for="imFile">Eski yedek dosyasını seç<input type="file" id="imFile" accept=".json,application/json"></label></div></section>
  <p class="hint">Aktarılan kayıtlarda saha tipi (İTPC / yeni TT) seçilmemiş olabilir; her kaydı açıp tipini seç. Yeni sistemde karşılığı olmayan cevaplar “Genel not” bölümüne eklenir. Aynı kayıt iki kez aktarılmaz.</p>`;
  app.querySelector("#back").onclick=renderList;
  app.querySelector("#imLocal").onclick=async()=>{const r=await migrateLocal();const out=app.querySelector("#imRes");
    if(!r){out.textContent="Bu uygulamadan eski kayıtlar görünmüyor (iPhone her ana ekran uygulamasının verisini ayrı tutar). 2. yolu kullan.";return}
    out.textContent=r.n?`${r.n} keşif ve ${r.ph} fotoğraf aktarıldı.`:"Yeni aktarılacak kayıt yok (hepsi daha önce aktarılmış).";if(r.n)toast(`${r.n} keşif aktarıldı`)};
  app.querySelector("#imFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    try{const d=JSON.parse(await f.text());if(d.app!=="saha-kesif")throw 0;toast("Aktarılıyor…",6000);
      const r=await importV1(d.surveys,async id=>{const u=d.photos?.[id];return u?await (await fetch(u)).blob():null});
      toast(r.n?`${r.n} keşif ve ${r.ph} fotoğraf aktarıldı`:"Yeni aktarılacak kayıt yok");if(r.n)renderList()}
    catch(err){toast("Bu dosya eski Saha Keşfi yedeği değil")}};
}
function init(){
  app.addEventListener("input",onInput);app.addEventListener("change",onInput);app.addEventListener("click",onClick);
  surveys=lsGet("sk2-surveys",{});prefs=lsGet("sk2-prefs",{});
  try{navigator.storage?.persist?.()}catch(e){}
  addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
  renderList();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;const u=document.getElementById("upd");u.hidden=false;document.getElementById("updGo").onclick=()=>{flush();location.reload()};document.getElementById("updX").onclick=()=>u.hidden=true});
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  }
}
init();
</script>
