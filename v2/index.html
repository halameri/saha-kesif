<style>
/* Layout: single-column field tool, sticky top bar, collapsible sections, large tap targets */

.chk span{display:grid;gap:2px;min-width:0}.chk small{color:var(--muted)}
.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
/* overlays: photo viewer + annotation */
.ov{position:fixed;inset:0;z-index:40;background:#0b0f12;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ov .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;background:#141b21}

.ov input.cap{flex:1;min-width:140px;background:#222c34;border:1px solid #33414c;border-radius:6px;color:#fff;padding:8px;min-height:40px}

.sw.on{outline:3px solid #e09b12;outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
const VERSION="4.8 · 27.11.2026";
/* =========================================================
   1. FORM DEFINITION
   kind: yn = Evet/Hayır/Bilmiyorum, ch = seçenek, num = sayı

const TYPES={itpc:"İTPC santrali",tt:"Yeni TT santrali"};
const TYPE_HINT={itpc:"Mevcut İTPC binası; binada elektrik var",tt:"Yeni kurulacak santral (konteyner olabilir)"};
const SEC=[
 {id:"alan",t:"Sistem salonu ve alan",items:[
  {k:"salon",kind:"yn",q:"Hazır sistem salonu var mı?",s:"Hazır sistem salonu",ph:1,phAlways:0,

  {k:"salonBos",kind:"yn",q:"Sistem salonunda bize verilecek boş alan var mı?",s:"Salonda bize verilecek alan",ph:1,ms:1,
   tip:"Bize ayrılacak yeri göster ve fotoğrafla. Fotoğraf üzerinde alanı işaretleyebilirsin (fotoğrafa dokun › İşaretle).",
   qn:["Raf / kabin için yer var","Salonun bir köşesi boş","Yer var ama düzenleme gerekir","Yer yetersiz","Yer bina yetkilisi tarafından gösterildi"]},
  {k:"oda",kind:"yn",q:"Ayrı boş oda var mı?",s:"Ayrı boş oda",ph:1,ms:1,
   qn:["Oda tamamen boş","Oda kullanılabilir görünüyor","Oda tadilat gerektirir","Odada klima var","Odaya giriş izni gerekiyor"]},
  {k:"kont",kind:"yn",q:"Konteyner / kabin için uygun alan var mı?",s:"Konteyner alanı",ph:1,ms:1,only:"tt",
   qn:["Bina bahçesinde alan var","Çatıda alan var","Zemin düz","Zemin hazırlığı gerekir","Vinç girişi mümkün"]}
 ]},
 {id:"sebeke",t:"Şebeke bağlantısı",only:"tt",items:[
  {k:"direk",kind:"yn",q:"Yakında elektrik direği var mı?",s:"Elektrik direği",ph:1,
   num:{k:"m",l:"Binadan direğe uzaklık",u:"m"},
   tip:"Mesafeyi adımla (1 adım ≈ 0,75 m) ya da Google Maps'te uzun bas › Mesafeyi ölç.",
   qn:["Direk binaya bitişik","Direk yolun karşı tarafında","Arada özel arazi var","Hat orta gerilim (OG)","Hat alçak gerilim (AG)"]},
  {k:"trafo",kind:"yn",q:"Yakında trafo var mı?",s:"Trafo",ph:1,

 ]},
 {id:"elektrik",t:"Elektrik durumu",items:[
  {k:"kesinti",kind:"num",q:"En kötü durumda elektrik günde kaç saat kesiliyor?",s:"Günlük kesinti (en kötü durum)",u:"saat",
   tip:"Bina görevlisine sor: “Yazın en kötü günlerde elektrik günde kaç saat kesik?” Kesinti yoksa 0 yaz.",
   qn:["Yazın kesinti artıyor","Bilgi bina görevlisinden alındı","Kesinti yok denecek kadar az","Bilgi kesin değil, tahmini"]},
  {k:"enuzun",kind:"num",q:"Ortalama en uzun kesintisiz kesinti kaç saat sürüyor?",s:"Ortalama en uzun kesintisiz kesinti",u:"saat",
   tip:"Akü yedeklemesi için asıl önemli olan budur. Günde toplam 12 saat kesik olabilir ama 3'er saatlik parçalar halinde."},
  {k:"duzen",kind:"ch",q:"Kesintiler programlı mı, rastgele mi?",s:"Kesinti düzeni",o:["Programlı","Rastgele","Karışık","Bilinmiyor"],
   qn:["Program: 2 saat açık / 2 saat kapalı","Program: 4 saat açık / 2 saat kapalı","Gece kesintisi daha fazla","Kesinti saatleri önceden duyuruluyor"]}
 ]},
 {id:"sogutma",t:"Soğutma",items:[
  {k:"sogutma",kind:"ch",q:"Bizim ekipman için soğutma nasıl sağlanacak?",s:"Soğutma",o:["Mevcut soğutma kullanılabilir","Yeni split klima gerekli","Bilinmiyor"],ph:1,phAlways:1,
   tip:"Mevcut klimaların sayısına, çalışıp çalışmadığına ve bizim ekipmanı da soğutup soğutamayacağına bak. Klimaların fotoğrafını çek.",
   qn:["Salonda merkezi klima var","Salonda split klimalar var","Mevcut klimalar yetersiz görünüyor","Klimalar jeneratöre bağlı","Klima dış ünitesi için yer var"]},
  {k:"isiEk",kind:"ch",q:"Sistem salonuna kurulursak mevcut soğutma 1–3 kW (≈ 3.400–10.000 BTU) ek ısıyı karşılar mı?",s:"Mevcut soğutma ek ısıyı karşılar mı",o:["Evet","Hayır – ayrı soğutma gerekli","Bilinmiyor"],
   tip:"Ekipmanımız aldığı elektriğin hemen hepsini ısıya çevirir: 1 kW ≈ 3.400 BTU. Klima sorumlusuna bu ek ısıyı mevcut klimaların kaldırıp kaldıramayacağını sor."}
 ]},
 {id:"talep",t:"Kurulum yeri ve talep edilen güç",items:[
  {k:"yer",kind:"ch",q:"Ekipmanımız nereye kurulacak?",s:"Kurulum yeri",o:["Sistem salonu","Ayrı oda","Belli değil"],talep:1,
   tip:"Sistem salonunda: normal 1 kW, en fazla 3 kW. Ayrı odada (kendi soğutmamızla): normal 3 kW, en fazla 5 kW. Farklı bir saha için (ör. Al-Faw 100 kW) değerleri elle yaz."}
 ]},
 {id:"jen",t:"Jeneratör",items:[
  {k:"jen",kind:"yn",q:"Sahada jeneratör var mı?",s:"Jeneratör",gens:1,
   tip:"Her jeneratör için gücünü (kVA), yaklaşık yüzde kaçının kullanıldığını ve asıl mı yedek mi olduğunu sor. Etiketinin fotoğrafını çek.",
   qn:["Jeneratörler otomatik devreye giriyor (ATS)","Jeneratör elle çalıştırılıyor","Yakıt ikmali düzenli","Jeneratör bakımsız görünüyor","Kapasite bilgisi bina görevlisinden alındı"]},
  {k:"ats",kind:"ch",q:"Jeneratör kesintide otomatik devreye giriyor mu? (ATS)",s:"Otomatik devreye girme (ATS)",o:["Evet","Hayır","Bilinmiyor"],

  {k:"yakit",kind:"num",q:"Yakıt deposu kesintisiz çalışmada kaç saat yetiyor?",s:"Yakıtın yettiği süre (kesintisiz)",u:"saat"},
  {k:"jenVer",kind:"ch",q:"Talep ettiğimiz güç sahanın jeneratöründen verilebilir mi?",s:"Talep edilen güç jeneratörden verilebilir mi",o:["Evet","Hayır","Bilinmiyor"],
   tip:"Talep edilen güç “Kurulum yeri ve talep edilen güç” bölümünde yazıyor."},
  {k:"stby",kind:"ch",q:"Saha yönetimi, yedek (standby) olarak kullanmak için bizden ayrı bir jeneratör istiyor mu?",s:"Bizden yedek (standby) jeneratör isteniyor mu",o:["Evet","Hayır","Bilinmiyor"],
   tip:"Sahada yedek jeneratör yoksa, kuracağımız jeneratörü yedek olarak da kullanmak isteyebilirler."}
 ]}
];
/* talep edilen güç: kurulum yerine göre normal (nominal) ve en fazla (max) kW; elle yazılırsa o kullanılır */
const TALEP_DEF={"Sistem salonu":{nom:1,max:3},"Ayrı oda":{nom:3,max:5}};
/* sistem salonunda da yeni split gerekiyorsa (mevcut soğutma ek ısıyı karşılıyor diye teyit edilmediyse) talep ayrı odayla aynı: 3 / 5 kW */
const talepDef=s=>{const y=A(s,"yer");if(y==="Sistem salonu")return A(s,"isiEk")==="Evet"?TALEP_DEF["Sistem salonu"]:TALEP_DEF["Ayrı oda"];return TALEP_DEF[y]||null};
/* güç kW ya da amper olarak girilebilir; amper → kVA (1 faz 220 V / 3 faz 380 V, faz başı) → kW (×PF) */
const kwPerA=ph=>(ph==="3"?Math.sqrt(3)*380:220)*PF/1000;
function talep(s){const yer=A(s,"yer"),d=talepDef(s),u=V(s,"yer.u")==="A"?"A":"kW",ph=V(s,"yer.ph")==="3"?"3":"1",k=kwPerA(ph);
  const inp=x=>{const n=num(V(s,"yer."+x));return n==null?null:u==="A"?n*k:n};
  const nom=inp("nom")??d?.nom??null,max=inp("max")??d?.max??null;
  return{yer,nom,max,u,ph,nomA:nom!=null?nom/k:null,maxA:max!=null?max/k:null,kva:max!=null?max/PF:null,ok:nom!=null||max!=null}}

  const known=use.filter(g=>g.free!=null);
  return{gens,count:gens.length,totalKva:gens.reduce((a,g)=>a+(g.kvaN||0),0),free:known.length?known.reduce((a,g)=>a+g.free,0):null,mainCount:main.length,backupCount:gens.length-main.length};
}
function energy(s){

  const battNeed=Math.ceil(dcA*hours/dod*aging/50)*50;
  const batt=num(L.batt)||battNeed;
  const backupReal=batt*dod/aging/dcA;
  const dcW=dcA*DCV,rectW=dcW/EFF,chgA=batt*CH,chgW=chgA*DCV/EFF;
  const cc=coolCfg(L);let mode=cc.mode;if(mode==="auto")mode=A(s,"sogutma")==="Yeni split klima gerekli"?"isi":"yok";
  /* gerekli soğutma: odadaki ısı (rectifier girişi) × 1,2 pay + 2.000 W dışarıdan */
  const needW=rectW*1.2+2000,needBTU=needW*3.412;
  let splitW=0,coolDesc="dahil değil",coolCalc="";
  if(mode==="isi"){const dx=needBTU>48000,eer=dx?AC_TYPES.hassas.eer:AC_TYPES.split.eer,n=Math.max(1,Math.ceil(needBTU/24000-0.02)),capBTU=dx?needBTU:n*24000;splitW=capBTU/eer;
    coolDesc=dx?"hassas/DX klima":`${n} × 24.000 BTU split`;
    coolCalc=`ısı ${fmt(rectW/1000)} kW × 1,2 + 2 kW = ${fmt(needW/1000)} kW ≈ ${fmt(Math.ceil(needBTU/1000)*1000,0)} BTU${dx?` ÷ ${fmt(eer)} EER`:` → ${n} × 24.000 BTU; tüketim ${fmt(capBTU,0)} ÷ ${fmt(eer)} EER`}`}
  else if(mode==="klima"){const t=AC_TYPES[cc.type]||AC_TYPES.split,unitW=cc.btu/t.eer;splitW=unitW*cc.run;coolCalc=`${cc.run} × ${fmt(cc.btu,0)} BTU ÷ ${fmt(t.eer)} EER`;
    coolDesc=`${cc.total>1?cc.total+" × ":""}${fmt(cc.btu,0)} BTU ${t.l.split(" (")[0].toLowerCase()}${cc.total>cc.run?` (${cc.run} çalışan, ${cc.total-cc.run} yedek)`:cc.run>1?` (${cc.run} çalışan)`:""}`}
  else if(mode==="kat"){splitW=rectW*cc.mult;coolDesc=`sistem yükünün ${fmt(cc.mult)} katı`}
  else if(mode==="manuel"&&cc.amps!=null){splitW=cc.amps*220;coolDesc=`elle girilen ${fmt(cc.amps)} A`}
  const splitOn=splitW>0,otherW=num(L.otherW)||0;
  const normalW=rectW+splitW+otherW,peakW=normalW+chgW;

  /* 220 V'ta 63 A'yı aşarsa tek faz olmaz: 3 faz 380 V, faz başı akıma göre sigorta */
  const tri=A220>MONO_MAX,reqA=tri?phase:A220;
  const breaker=BREAKERS.find(b=>b>=reqA*1.25)||Math.ceil(reqA*1.25);
  const brkTxt=tri?`${breaker} A · 3 faz 380 V`:`${breaker} A · 220 V`;
  const aOf=w=>tri?w/(1.732*380):w/220,genNeed=kVA/(0.8*0.9),genKVA=[20,30,45,60,80,100,150,200,250,300,400,500,650,800,1000].find(g=>g>=genNeed)||Math.ceil(genNeed);
  const haveBTU=mode==="klima"?cc.btu*cc.run:null,coolOk=haveBTU==null?null:haveBTU>=needBTU*0.98;
  const worst=num(A(s,"enuzun"))??num(A(s,"kesinti"));
  const worstSrc=num(A(s,"enuzun"))!=null?"en uzun tek kesinti":"günlük kesinti";
  const g=genStats(s);
  return{dcA,hours,li,batLabel,batt,battNeed,backupReal,splitOn,coolDesc,coolMode:mode,splitW,dcW,rectW,chgA,chgW,normalW,peakW,A220,kVA,phase,breaker,tri,brkTxt,needBTU,needW,coolCalc,otherW,aOf,genNeed,genKVA,haveBTU,coolOk,worst,worstSrc,
    backupOk:worst==null?null:worst<=hours,genOk:g.free==null?null:g.free>=kVA,genFree:g.free};
}

function siteSummary(s){

    else t="Sahada hazır bir sistem salonu bulunmaktadır"}
  else if(sal==="no")t="Sahada hazır bir sistem salonu bulunmamaktadır";

  if(oda==="yes")t=t?`${t}; ayrıca kullanılabilecek ayrı bir boş oda vardır${oaT}`:`Kullanılabilecek ayrı bir boş oda vardır${oaT}`;

      const anyPct=g.gens.some(x=>x.pctN!=null);let gt;
      if(!anyPct){/* aynı güçteki jeneratörleri grupla */
        const grp={};g.gens.forEach(x=>{const key=(x.kvaN!=null?fmt(x.kvaN,0)+" kVA":"gücü bilinmeyen")+"|"+(x.role==="Yedek"?"yedek":"asıl");grp[key]=(grp[key]||0)+1});
        const kvas=[...new Set(g.gens.map(x=>x.kvaN))];
        if(kvas.length===1&&kvas[0]!=null&&many)gt=`Sahada ${fmt(kvas[0],0)} kVA gücünde ${g.count} adet jeneratör bulunmaktadır${g.mainCount&&g.backupCount?` (${g.mainCount} asıl, ${g.backupCount} yedek)`:g.backupCount?" (yedek)":""}`;
        else gt=`Sahada ${Object.entries(grp).map(([key,n])=>{const[kv,r]=key.split("|");return `${n} adet ${kv} ${r}`}).join(" ve ")} jeneratör bulunmaktadır`;
      }else gt=`Sahada ${g.count} adet jeneratör bulunmaktadır: ${g.gens.map(x=>`${x.kvaN!=null?fmt(x.kvaN,0)+" kVA":"gücü bilinmeyen"} ${x.role==="Yedek"?"yedek":"asıl"} jeneratör${x.pctN===0?" (şu an boşta)":x.pctN!=null?` (yaklaşık %${fmt(x.pctN,0)} yüklü)`:""}`).join(", ")}`;
      P.push(gt+".");
      if(g.free!=null)P.push(`${g.mainCount&&g.backupCount?"Asıl jeneratörlerde":"Jeneratörlerde"} yaklaşık ${fmt(g.free,0)} kVA boş kapasite bulunmaktadır.`)}
    else P.push("Sahada jeneratör bulunmaktadır; kapasite bilgisi alınamamıştır.")}
  else if(j==="unk")P.push("Sahada jeneratör olup olmadığı netleştirilememiştir.");
  if(j!=="no"){const at=A(s,"ats"),yk=num(A(s,"yakit")),jv=A(s,"jenVer"),sub=many?"Jeneratörler":"Jeneratör";
    const atT=at==="Evet"?`${sub} kesinti anında otomatik olarak devreye girmekte`:at==="Hayır"?`${sub} kesintide elle çalıştırılmakta`:"";
    const ykT=yk!=null?`yakıt deposu kesintisiz çalışmada yaklaşık ${fmt(yk)} saat yetmektedir`:"";
    if(atT)P.push(`${atT}${ykT?` olup ${ykT}`:"dır"}.`);else if(ykT)P.push(cap(ykT)+".");
    const lim=tl.max!=null?` (en fazla ${fmt(tl.max)} kW)`:"";
    if(jv==="Evet")P.push(`Talep ettiğimiz gücün${lim} sahanın jeneratöründen karşılanabileceği bildirilmiştir.`);
    else if(jv==="Hayır")P.push(`Talep ettiğimiz gücün${lim} sahanın jeneratöründen karşılanamayacağı bildirilmiştir.`);}
  if(A(s,"stby")==="Evet"){const noBk=!(s.gens||[]).some(x=>x.role==="Yedek");
    P.push(`${noBk?"Sahada yedek jeneratör bulunmadığından s":"S"}aha yönetimi, yedek (standby) olarak kullanılmak üzere tarafımızdan ayrı bir jeneratör kurulmasını talep etmektedir.`)}
  /* 5) enerji hesabı */
  if(s.load?.on){const e=energy(s);
    P.push(`Bu lokasyonda öngörülen ${fmt(e.dcA)} A (-48 V DC) yükümüz${e.splitOn?" soğutma ile birlikte":""} normalde (şarjsız) yaklaşık ${fmt(e.normalW/1000)} kW (${fmt(e.aOf(e.normalW),0)} A${e.tri?"/faz":""}), kesinti sonrası akü şarjı sırasında en fazla yaklaşık ${fmt(e.peakW/1000)} kW (${e.tri?`3 faz 380 V'ta faz başı yaklaşık ${fmt(e.phase,0)} A`:`220 V'ta yaklaşık ${fmt(e.A220,0)} A`}, ${fmt(e.kVA)} kVA) güç gerektirmektedir; güvenlik payıyla ${e.tri?`3 faz ${e.breaker} A`:`${e.breaker} A`} besleme talep edilmelidir.`);
    if(e.genOk===true)P.push("Jeneratörlerin boş kapasitesi bu ihtiyacı karşılamaya yeterli görünmektedir.");
    else if(e.genOk===false)P.push("Jeneratörlerin boş kapasitesi bu ihtiyaç için yetersiz görünmektedir.");
    if(e.backupOk===false)P.push(`${e.worstSrc==="en uzun tek kesinti"?"Tek seferdeki en uzun kesinti":"Günlük kesinti süresi"} (${fmt(e.worst)} saat) ${fmt(e.hours,0)} saatlik akü yedeklemesini aştığından jeneratör desteği gereklidir.`);
    else if(e.backupOk===true&&e.worst>0)P.push(`Kesinti süresi ${fmt(e.hours,0)} saatlik akü yedeklemesi ile karşılanabilmektedir.`);}
  return P.join(" ");
}
function overallSummary(list,label){
  if(!list.length)return "";
  const P=[],n=list.length;
  P.push(`Bu rapor, ${label} ziyaret edilen ${n} sahanın enerji açısından mevcut durumunu özetlemektedir (${list.map(s=>s.name||"Adsız saha").join(", ")}).`);
  const it=list.filter(s=>s.type==="itpc").length,tt=list.filter(s=>s.type==="tt").length;
  if(it&&tt)P.push(`Sahaların ${it} tanesi mevcut İTPC santrali, ${tt} tanesi yeni TT santrali lokasyonudur.`);
  else if(it)P.push(n>1?"Sahaların tamamı mevcut İTPC santralidir.":"Saha mevcut bir İTPC santralidir.");
  else if(tt)P.push(n>1?"Sahaların tamamı yeni TT santrali lokasyonudur.":"Saha yeni bir TT santrali lokasyonudur.");
  const nm=f=>list.filter(f).map(s=>s.name||"adsız saha");
  const joinTr=a=>a.length>1?a.slice(0,-1).join(", ")+" ve "+a[a.length-1]:a[0]||"";
  const where=a=>a.length===n&&n>1?"Tüm sahalarda":`${joinTr(a)} ${a.length>1?"sahalarında":"sahasında"}`;
  const salon=nm(s=>A(s,"salonBos")==="yes"),oda=nm(s=>A(s,"oda")==="yes");
  if(salon.length)P.push(`${where(salon)} sistem salonunda tarafımıza verilebilecek boş alan bulunmaktadır${oda.length?`; ${oda.length===n&&n>1?"tüm sahalarda":where(oda)} ayrıca kullanılabilecek ayrı bir boş oda vardır`:""}.`);
  else if(oda.length)P.push(`${where(oda)} kullanılabilecek ayrı bir boş oda bulunmaktadır.`);
  /* elektrik kesintisi: her saha ayrı (aralık vermek, kesintisiz sahaları da kesintili gösteriyordu) */
  {const ks=list.map(s=>({s,k:num(A(s,"kesinti")),en:num(A(s,"enuzun"))})).filter(x=>x.k!=null||x.en!=null);
   const none=ks.filter(x=>x.k===0).map(x=>x.s.name||"adsız saha");
   if(none.length)P.push(`${where(none)} elektrik kesintisi yok denecek kadar azdır.`);
   for(const x of ks.filter(x=>x.k!==0))P.push(`${x.s.name||"Adsız saha"} sahasında ${x.k!=null?`elektrik en kötü durumda günde yaklaşık ${fmt(x.k)} saat kesilmektedir`:"günlük kesinti süresi bilinmemektedir"}${x.en!=null?`; tek seferde en uzun kesinti yaklaşık ${fmt(x.en)} saat sürmektedir`:""}.`)}
  /* soğutma: yeni klima ihtiyacı ve "ek ısıyı karşılamıyor" tek cümlede */
  const heatNo=s=>A(s,"isiEk")==="Hayır – ayrı soğutma gerekli";
  const needAC=nm(s=>A(s,"sogutma")==="Yeni split klima gerekli"||heatNo(s)),okAC=nm(s=>A(s,"sogutma")==="Mevcut soğutma kullanılabilir"&&!heatNo(s));
  const allHeat=needAC.length&&list.filter(s=>A(s,"sogutma")==="Yeni split klima gerekli"||heatNo(s)).every(heatNo);
  if(needAC.length)P.push(`${where(needAC)} ${allHeat?"mevcut soğutma ek ısıyı karşılayamadığından ":""}ekipmanlarımız için ayrı split klima gerekmektedir.`);
  if(okAC.length)P.push(`${where(okAC)} mevcut soğutma kullanılabilecektir.`);
  const gj=nm(s=>A(s,"jen")==="yes"),man=nm(s=>A(s,"ats")==="Hayır"&&A(s,"jen")!=="no"),auto=nm(s=>A(s,"ats")==="Evet");
  if(gj.length)P.push(`${where(gj)} jeneratör bulunmaktadır${man.length&&man.length===gj.length?"; jeneratörler kesintide elle çalıştırılmaktadır":""}.`);
  if(man.length&&man.length!==gj.length)P.push(`${where(man)} jeneratör kesintide elle çalıştırılmaktadır.`);
  const jvY=nm(s=>A(s,"jenVer")==="Evet"),jvN=nm(s=>A(s,"jenVer")==="Hayır");
  if(jvY.length)P.push(`${where(jvY)} talep ettiğimiz güç sahanın jeneratöründen karşılanabilecektir.`);
  if(jvN.length)P.push(`${where(jvN)} talep ettiğimiz güç sahanın jeneratöründen karşılanamadığından kendi jeneratörümüzün kurulması gerekmektedir.`);
  const sb=nm(s=>A(s,"stby")==="Evet");if(sb.length)P.push(`${where(sb)} saha yönetimi, yedek (standby) olarak kullanılmak üzere tarafımızdan ayrı bir jeneratör talep etmektedir.`);
  const noGen=nm(s=>A(s,"jen")==="no");if(noGen.length)P.push(`${where(noGen)} jeneratör bulunmadığından kendi jeneratörümüzün kurulması gerekmektedir.`);
  const weakGen=nm(s=>needGen(s)&&A(s,"jen")!=="no"&&A(s,"jenVer")!=="Hayır"&&A(s,"stby")!=="Evet");if(weakGen.length)P.push(`${where(weakGen)} jeneratörün boş kapasitesi yetersiz göründüğünden kendi jeneratörümüzün kurulması gerekebilir.`);
  const en=list.filter(s=>s.load?.on).map(s=>({s,e:energy(s)}));
  if(en.length){const ws=en.map(x=>x.e.peakW/1000),bs=[...new Set(en.map(x=>x.e.brkTxt))];
    P.push(`Enerji hesabı yapılan sahalarda ihtiyacımız saha başına en kötü durumda yaklaşık ${fmt(Math.min(...ws))}${Math.max(...ws)-Math.min(...ws)>0.05?`–${fmt(Math.max(...ws))}`:""} kW olup ${bs.length===1?bs[0]:bs.join(", ")} besleme talep edilmektedir.`);
    const over=en.filter(x=>x.e.backupOk===false).map(x=>x.s.name);
    if(over.length)P.push(`${over.join(", ")} ${over.length>1?"sahalarında":"sahasında"} kesinti süresi akü yedeklemesini aştığı için jeneratör desteği gereklidir.`);}
  return P.join(" ");
}

      <label class="f">Gücü (kVA)<input class="num" inputmode="decimal" data-g="kva" value="${esc(x.kva)}" placeholder="ör. 100"></label>

function genCalcText(st){if(!st||st.kvaN==null)return "Gücü ve kullanım oranını yazınca boş kapasite hesaplanır.";if(st.free==null)return `${fmt(st.kvaN,0)} kVA · toplam ≈ ${fmt(st.kvaN*1000/230,0)} A (230 V)`;return `Boş kapasite ≈ <b>${fmt(st.free,0)} kVA</b> (≈ ${fmt(st.free*1000/230,0)} A, 230 V)`}
function genTotText(g){return `${g.count} jeneratör${g.backupCount?` (${g.mainCount} asıl, ${g.backupCount} yedek)`:""} · toplam ${fmt(g.totalKva,0)} kVA${g.free!=null?` · ${g.backupCount&&g.mainCount?"asıl ":""}boş kapasite ≈ ${fmt(g.free,0)} kVA`:""}`}
function coolHtml(){
  const L=cur.load,c=coolCfg(L),sel=(k,opts,v)=>`<select data-l="${k}">${opts.map(([val,l])=>`<option value="${val}"${String(v)===String(val)?" selected":""}>${l}</option>`).join("")}</select>`;
  const showKlima=c.mode==="klima",isi=c.mode==="isi"||(c.mode==="auto"&&A(cur,"sogutma")==="Yeni split klima gerekli");
  return `<div class="f" style="color:var(--ink)">Soğutma yükü</div>
   <label class="f">Hesap yöntemi${sel("coolMode",COOL_MODES,c.mode)}</label>
   ${c.mode==="auto"?`<div class="hint">Soğutma sorusunda “Yeni split klima gerekli” seçiliyse aşağıdaki klima hesaba eklenir${A(cur,"sogutma")==="Yeni split klima gerekli"?" (şu an ekleniyor)":" (şu an eklenmiyor)"}. Klima DC yükten otomatik boyutlanır; belirli bir klima için “Klima tipi ve kapasitesi”ni seç.</div>`:""}
   ${isi?`<div class="hint">Isı = DC yük ÷ 0,95 (rectifier girişi, hepsi ısıya döner) × 1,2 pay + 2 kW dışarıdan gelen ısı → BTU (× 3,412). Tüketim = BTU ÷ EER (split 9,5, 48.000 BTU üstü hassas/DX 10).</div>`:""}
   ${showKlima?`<div class="grid2">
     <label class="f">Klima tipi${sel("acType",Object.entries(AC_TYPES).map(([k,v])=>[k,v.l]),c.type)}</label>
     <label class="f">Kapasite (BTU)${sel("btu",BTUS.map(b=>[b,`${fmt(b,0)} BTU (${fmt(b/12000)} ton)`]),c.btu)}</label>
     <label class="f">Toplam adet<input class="num" inputmode="numeric" data-l="acTotal" value="${esc(L.acTotal??c.total)}"></label>
     <label class="f">Aynı anda çalışan<input class="num" inputmode="numeric" data-l="acRun" value="${esc(L.acRun??c.run)}"></label>
    </div><div class="hint">Bir klimanın tüketimi ≈ ${fmt((c.btu/(AC_TYPES[c.type]||AC_TYPES.split).eer),0)} W (kapasite ÷ verim). Yedek klimalar yüke eklenmez. Kesin değer klimanın etiketinden alınmalı.</div>`:""}
   ${c.mode==="kat"?`<label class="f" style="max-width:240px">Sistem yükünün kaç katı<input class="num" inputmode="decimal" data-l="mult" value="${esc(L.mult??2)}"></label><div class="hint">Sistem yükü = rectifier'ın çektiği AC güç. Bazı ekipler soğutmayı bunun 2 katı olarak alıyor.</div>`:""}
   ${c.mode==="manuel"?`<label class="f" style="max-width:240px">Soğutma yükü (A, 220 V)<input class="num" inputmode="decimal" data-l="coolA" value="${esc(L.coolA??"")}" placeholder="ör. 12"></label><div class="hint">Ekibin verdiği değeri ya da klima etiketindeki akımı yaz.</div>`:""}`;
}

   <div class="item">
    <label class="chk" for="loadOn"><input type="checkbox" id="loadOn" ${L.on?"checked":""}><span><b>Bu sahada enerji hesabı yap ve rapora ekle</b><small>DC yükümüzden AC ihtiyacını, rectifier, akü ve soğutmayı hesaplar</small></span></label>
    <div ${L.on?"":"hidden"} id="loadBox" style="display:grid;gap:10px">
     <div class="grid2">

function energyOutHtml(e){
  const kw=w=>fmt(w/1000),am=w=>fmt(e.aOf(w)),aH=e.tri?"A / faz":"A";
  const row=(n,t,sub,w,cls="")=>`<tr class="${cls}"><td><b>${n?n+". ":""}${t}</b>${sub?`<small>${sub}</small>`:""}</td><td>${kw(w)}</td><td>${am(w)}</td></tr>`;
  return `<div class="hint" style="margin:0 0 6px">Besleme: <b>${e.tri?"3 faz 380 V":"tek faz 220 V"}</b>${e.tri?` – 220 V'ta ${fmt(e.A220,0)} A olur, tek faza sığmaz; akımlar faz başıdır.`:""}</div>
  <table class="res eres"><thead><tr><th>Kalem</th><th>kW</th><th>${aH}</th></tr></thead><tbody>
   ${row(1,"DC yük → rectifier girişi",`${fmt(e.dcA)} A × ${DCV} V = ${kw(e.dcW)} kW ÷ ${fmt(EFF,2)} verim`,e.rectW)}
   ${row(2,"Soğutma",e.splitOn?`${esc(e.coolDesc)}${e.coolCalc?" · "+esc(e.coolCalc):""}`:"dahil değil (mevcut soğutma)",e.splitW)}
   ${e.otherW?row(3,"Diğer AC yükler","aydınlatma, priz vb.",e.otherW):""}
   ${row("","Minimum – şarjsız","elektrik varken, akü dolu",e.normalW,"tot")}
   ${row(e.otherW?4:3,"Akü şarjı",`sadece kesinti sonrası · ${fmt(e.batt,0)} Ah × 0,1C = ${fmt(e.chgA,0)} A × ${DCV} V ÷ ${fmt(EFF,2)}`,e.chgW)}
   ${row("","Maksimum – şarjlı",`minimum + şarj · ${fmt(e.kVA)} kVA (cos φ ${fmt(PF)})`,e.peakW,"tot")}
   <tr class="tot big"><td><b>Talep edilecek</b><small>maksimum ${fmt(e.tri?e.phase:e.A220)} A × 1,25 → standart sigorta</small></td><td colspan="2">${e.brkTxt}</td></tr>
  </tbody></table>
  <table class="res" style="margin-top:8px"><tbody>
   <tr><td>Jeneratör (en az)<small>${fmt(e.kVA)} kVA ÷ (0,8 yük × 0,9 sıcaklık)</small></td><td>${fmt(e.genKVA,0)} kVA</td></tr>
   <tr><td>Rectifier kapasitesi<small>yük + şarj, N+1</small></td><td>≥ ${Math.ceil((e.dcA+e.chgA)/10)*10} A</td></tr>
   <tr><td>Önerilen akü<small>${esc(e.batLabel)}, ${fmt(e.hours,0)} saat</small></td><td>${fmt(e.battNeed,0)} Ah</td></tr>
   <tr><td>Seçilen akü ile yedekleme<small>yaşlanma payı dahil</small></td><td>≈ ${fmt(e.backupReal)} saat</td></tr>
  </tbody></table>
  ${e.backupOk===false?`<div class="flag bad">⚠️ ${e.worstSrc==="en uzun tek kesinti"?"En uzun kesinti":"Günlük kesinti"} (${fmt(e.worst)} saat) akü yedeklemesini (${fmt(e.hours,0)} saat) aşıyor. Jeneratör desteği gerekli.</div>`:e.backupOk===true?`<div class="flag ok">✓ Kesinti süresi (${fmt(e.worst)} saat) akü yedeklemesi içinde.</div>`:""}
  ${e.coolOk===false?`<div class="flag bad">⚠️ Seçilen klima (${fmt(e.haveBTU,0)} BTU) yetersiz; bu yük için ≈ ${fmt(Math.ceil(e.needBTU/1000)*1000,0)} BTU gerekir. Kapasiteyi/adedi artır veya hassas (DX) klima seç.</div>`:""}
  ${e.genOk===false?`<div class="flag bad">⚠️ Jeneratör boş kapasitesi (≈ ${fmt(e.genFree,0)} kVA) ihtiyaçtan (${fmt(e.kVA)} kVA) az.</div>`:e.genOk===true?`<div class="flag ok">✓ Jeneratör boş kapasitesi (≈ ${fmt(e.genFree,0)} kVA) ihtiyaç için yeterli.</div>`:""}`;
}

    <label class="f" for="m-gov">İl / bölge<input id="m-gov" data-m="gov" value="${esc(s.gov)}" placeholder="konumdan dolar · ör. Maysan"></label>

    <div class="hint">Konumumu al'a basınca internet varsa harita kendiliğinden eklenir. Uydu görüntüsü için: Haritada aç › ekran görüntüsü al › buradan ekle. Haritaya dokunup binayı işaretleyebilirsin.</div></div>
   <div><div class="f" style="margin-bottom:6px">Sahanın genel fotoğrafları</div>${photoStrip("genel")}<div class="row" style="margin-top:6px">${addPhotoBtn("genel","📷 Genel fotoğraf ekle")}</div></div>
  </section>
  ${s.type?SEC.filter(sec=>!sec.only||sec.only===s.type).map((sec,i)=>{const its=sec.items.filter(it=>shown(s,it,sec));const d=its.filter(it=>answered(s,it)).length;
    return `<details class="sec" data-sec="${sec.id}" ${i===0?"open":""}><summary><span class="sn">${i+1}</span><h2>${sec.t}</h2><span class="cnt" id="c-${sec.id}">${d}/${its.length}</span><span class="chev">›</span></summary>${its.map(it=>itemHtml(sec,it)).join("")}</details>`}).join("")+energyHtml()
   :`<div class="empty"><b>Önce saha tipini seç</b><span class="muted">İTPC santrali mi, yeni TT santrali mi?</span></div>`}
  <section class="panel" aria-label="Özet">
   <h2 style="font-size:1.15rem;text-transform:uppercase">Saha özeti</h2>

   <textarea id="sumTxt" style="min-height:160px">${esc(s.summary)}</textarea>
   <div class="row"><button type="button" class="btn sm" id="sumRe">↻ Özeti yeniden yaz</button><span class="hint" id="sumState">${s.summaryEdited?"Elle düzenlendi":"Otomatik"}</span></div>
   <div><div class="f" style="margin-bottom:6px">Genel not (isteğe bağlı)</div>${noteHtml("__gen")}${qnHtml("__gen",GENERAL_QN,false)}</div>
   <div id="delZone"><button class="btn ghost danger sm" id="del">Bu keşfi sil</button></div>
  </section>`;
  app.querySelector("#back").onclick=()=>{flush();renderList()};
  app.querySelector("#gps").onclick=getGps;
  const afterCoord=c=>{const i=app.querySelector("#m-coord");if(i)i.value=cur.coord;const h=app.querySelector("#coordHint");if(h)h.innerHTML=coordHint();dirty();try{fillGov(true)}catch(e){}};
  app.querySelector("#gpsMap").onclick=()=>openMapPicker(cur,c=>{setSiteCoord(cur,c,"haritadan");afterCoord()});
  app.querySelector("#gpsPh").onclick=()=>{const g=photoGps(cur);if(g){setSiteCoord(cur,g,"fotoğraftan");afterCoord();return}toast("Sahada çektiğin bir fotoğrafı seç");pickGpsFile(c=>{setSiteCoord(cur,c,"fotoğraftan");afterCoord()})};

function coordHint(){const c=parseCoord(cur.coord);return c?`<a href="https://www.google.com/maps?q=${c[0]},${c[1]}" target="_blank" rel="noopener">Haritada aç</a>`:"İnternet gerekmez."}
function refreshSummary(){if(!cur.summaryEdited){cur.summary=siteSummary(cur);const t=app.querySelector("#sumTxt");if(t&&document.activeElement!==t)t.value=cur.summary}}
function refreshCounts(){const p=progress(cur);const tp=app.querySelector("#tProg");if(tp)tp.textContent=`${p.d}/${p.t} soru`;
  for(const sec of SEC){const el=app.querySelector("#c-"+sec.id);if(!el)continue;const its=sec.items.filter(it=>shown(cur,it,sec));el.textContent=`${its.filter(it=>answered(cur,it)).length}/${its.length}`}}
function refreshEnergy(){const o=app.querySelector("#energyOut");if(o)o.innerHTML=energyOutHtml(energy(cur))}
function rerenderItem(k){const {sec,it}=ALL.find(x=>x.it.k===k);const el=app.querySelector(`.item[data-item="${k}"]`);if(el){el.outerHTML=itemHtml(sec,it);hydrate()}}
function addGen(){cur.gens.push({id:uid(),kva:"",pct:"",role:cur.gens.length?"Yedek":"Asıl",note:""});rerenderItem("jen");dirty();const l=app.querySelectorAll(".gen");l[l.length-1]?.querySelector("input")?.focus()}
function askDelete(){const z=app.querySelector("#delZone");z.innerHTML=`<div class="confirm"><b>Bu keşif kalıcı olarak silinsin mi?</b><div class="row"><button class="btn danger" id="delY">Evet, sil</button><button class="btn" id="delN">Vazgeç</button></div></div>`;
  z.querySelector("#delN").onclick=()=>{z.innerHTML=`<button class="btn ghost danger sm" id="del">Bu keşfi sil</button>`;z.querySelector("#del").onclick=askDelete};
  z.querySelector("#delY").onclick=()=>{clearTimeout(saveT);saveT=null;for(const arr of Object.values(cur.photos||{}))for(const p of arr){idbDel(p.id);if(p.orig)idbDel(p.orig);if(p.cab)idbDel(p.cab.src)}delete surveys[cur.id];saveAll();toast("Keşif silindi");renderList()}}

/* events */
function appendNote(old,t){old=(old||"").trim();if(old.includes(t))return old;return old?old.replace(/[.\s]*$/,"")+". "+t:t}
function onInput(e){
  const el=e.target;
  if(view==="report"){reportInput(e);return}
  if(!cur||view!=="editor")return;
  if(el.dataset.m){cur[el.dataset.m]=el.value;if(el.dataset.m==="gov")cur.govAuto=false;if(el.dataset.m==="coord"&&e.type==="change")fillGov(true);if(el.dataset.m==="name")app.querySelector("#tName").textContent=el.value||"Yeni saha";if(el.dataset.m==="coord")app.querySelector("#coordHint").innerHTML=coordHint();refreshSummary();dirty();return}
  if(el.dataset.num){cur.a[el.dataset.num]=el.value.trim();refreshCounts();refreshSummary();refreshEnergy();dirty();return}
  if(el.dataset.v&&!el.isConnected)return;
  if(el.dataset.v==="yer.u"||el.dataset.v==="yer.ph"){const ae=document.activeElement;if(ae&&ae!==el&&ae.dataset?.v)ae.blur();const old=talep(cur);cur.v[el.dataset.v]=el.value;const nw=talep(cur);
    for(const x of ["nom","max"]){const n=num(V(cur,"yer."+x));if(n==null)continue;const kw=old.u==="A"?n*kwPerA(old.ph):n;cur.v["yer."+x]=nw.u==="A"?String(Math.round(kw/kwPerA(nw.ph))):String(Math.round(kw*10)/10)}
    rerenderItem("yer");refreshSummary();dirty();return}
  if(el.dataset.v){cur.v[el.dataset.v]=el.value;if(el.dataset.v.startsWith("yer.")){const c=app.querySelector("#tl-conv");if(c){const t=talep(cur);c.textContent=t.ok?"= "+talepTxt(t):""}}const k=el.dataset.v.split(".")[0];const ar=app.querySelector("#ar-"+k);if(ar){const a=areaOf(cur,k);ar.textContent=a?`≈ ${fmt(a,0)} m²`:""}refreshSummary();dirty();return}
  if(el.dataset.note){if(el.dataset.note==="__gen")cur.genNote=el.value;else cur.n[el.dataset.note]=el.value;dirty();return}
  if(el.dataset.g){const id=el.closest("[data-gen]").dataset.gen,g=cur.gens.find(x=>x.id===id);g[el.dataset.g]=el.value;
    const st=genStats(cur);const box=el.closest(".gen").querySelector("[data-gcalc]");box.innerHTML=genCalcText(st.gens[cur.gens.indexOf(g)]);const tt=app.querySelector("#genTot");if(tt)tt.textContent=genTotText(st);
    refreshSummary();refreshEnergy();dirty();return}
  if(el.id==="loadOn"){cur.load.on=el.checked;app.querySelector("#loadBox").hidden=!el.checked;refreshSummary();dirty();return}
  if(el.dataset.l){cur.load[el.dataset.l]=el.value;
    if(["coolMode","acType","btu"].includes(el.dataset.l)&&e.type==="change"){const cb=app.querySelector("#coolBox");if(cb)cb.innerHTML=coolHtml()}
    refreshEnergy();refreshSummary();dirty();return}
  if(el.id==="sumTxt"){cur.summary=el.value;cur.summaryEdited=true;app.querySelector("#sumState").textContent="Elle düzenlendi";dirty();return}
  if(el.dataset.up&&e.type==="change"){addPhotos(el.dataset.up,[...el.files]);el.value=""}
}
function onClick(e){
  const b=e.target.closest("button,img[data-open]");if(!b||!cur||view!=="editor")return;
  if(b.dataset.open!==undefined){openViewer(b.dataset.open,+b.dataset.i);return}
  if(b.dataset.type){cur.type=b.dataset.type;refreshSummary();dirty();renderEditor();return}
  if(b.dataset.ans){const k=b.dataset.ans,v=b.dataset.val;cur.a[k]=cur.a[k]===v?"":v;rerenderItem(k);if(k==="isiEk"&&app.querySelector(".item[data-item='yer']"))rerenderItem("yer");refreshCounts();refreshSummary();refreshEnergy();dirty();return}
  if(b.dataset.addnote){const key=b.dataset.addnote,ta=document.createElement("textarea");ta.dataset.note=key;ta.placeholder="Not";b.replaceWith(ta);ta.focus();return}
  if(b.dataset.qn){const key=b.dataset.qn,t=b.dataset.txt;let val;
    if(key==="__gen"){cur.genNote=appendNote(cur.genNote,t);val=cur.genNote}else{cur.n[key]=appendNote(cur.n[key],t);val=cur.n[key]}
    const scope=key==="__gen"?app.querySelector('[aria-label="Özet"]'):app.querySelector(`.item[data-item="${key}"]`);
    let ta=scope.querySelector(`textarea[data-note="${key}"]`);if(!ta){ta=document.createElement("textarea");ta.dataset.note=key;scope.querySelector(`[data-addnote="${key}"]`)?.replaceWith(ta)}
    ta.value=val;b.classList.add("used");dirty();return}
  if(b.dataset.grole){const id=b.closest("[data-gen]").dataset.gen,g=cur.gens.find(x=>x.id===id);g.role=b.dataset.grole;rerenderItem("jen");refreshSummary();refreshEnergy();dirty();return}

/* annotation editor: pen, arrow, circle, rectangle, text */

   </div><div class="stage" id="stage"><canvas id="cv" width="${W}" height="${H}"></canvas></div>

    if(s.t==="pen"){ctx.beginPath();s.pts.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}

    else if(s.t==="circle"){ctx.beginPath();ctx.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.abs(s.x2-s.x1)/2,Math.abs(s.y2-s.y1)/2,0,0,Math.PI*2);ctx.stroke()}

/* Kabin yerleştirme (3D): boş alan fotoğrafına gerçek ölçülü kutular; sürükle, boyutla, kendi ekseninde döndür, bakış açısını fotoğrafa uydur */

async function pdfFromJpegs(blobs){
  const enc=new TextEncoder(),parts=[];let off=0;const offs=[];
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);off+=b.length};
  const obj=(id,body)=>{offs[id]=off;push(`${id} 0 obj\n`);if(typeof body==="string")push(body);else body();push("\nendobj\n")};
  push("%PDF-1.4\n");push(new Uint8Array([37,226,227,207,211,10]));
  const n=blobs.length,kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>`);
  for(let i=0;i<n;i++){const pid=3+i*3,cid=pid+1,iid=pid+2;const bytes=new Uint8Array(await blobs[i].arrayBuffer());
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);push(bytes);push("\nendstream")})}
  const total=3+n*3,xo=off;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}

function anchorSave(b,filename){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function saveFile({filename,data,blob,type,onDone}){
  const mime=type||"text/plain",b=blob||new Blob([data],{type:mime+";charset=utf-8"});
  let file=null;try{file=new File([b],filename,{type:mime})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){const sh=document.getElementById("sheet");document.getElementById("shName").textContent=`${filename} (${fmt(b.size/1048576)} MB)`;sh.hidden=false;
    document.getElementById("shX").onclick=()=>sh.hidden=true;
    document.getElementById("shGo").onclick=()=>{navigator.share({files:[file],title:filename}).then(()=>{sh.hidden=true;onDone&&onDone()}).catch(e=>{if(e&&e.name!=="AbortError")anchorSave(b,filename)})};return}
  anchorSave(b,filename);toast("Dosya hazır");onDone&&onDone()}

}

function persist(){saveT=null;if(cur)surveys[cur.id]=cur;if(saveAll()){prefs.unsaved=(prefs.unsaved||0)+1;savePrefs()}const sv=app.querySelector("#saved");if(sv)sv.textContent="Kaydedildi ✓"}
function flush(){if(saveT){clearTimeout(saveT);persist()}}


/* =========================================================
   10. IMPORT FROM OLD VERSION (Saha Keşfi 1)
   ========================================================= */
const V1_LABEL={"sebeke.direk":"Elektrik direği","sebeke.trafo":"Trafo","sebeke.engel":"Hat güzergâhı","sebeke.saat":"Elektrik kesintisi","mevcut.jen":"Mevcut jeneratör","mevcut.dc":"Mevcut doğrultucu / akü",
 "alan.olcu":"Saha ölçüsü","alan.oda":"Hazır sistem odası","alan.bosoda":"Boş oda","alan.bosalan":"Sistem salonunda boş alan","alan.jen":"Jeneratör yeri","alan.yakit":"Yakıt kamyonu erişimi","alan.su":"Su / sel riski","alan.zemin":"Zemin",
 "sogutma.dis":"Klima dış ünite yeri","sogutma.gunes":"Odanın güneş alması","sogutma.aku":"Akü yeri","ges.alan":"Panel alanı","ges.cati":"Çatı (GES)","ges.golge":"Gölge","ges.guney":"Güney yönü","ges.zemin":"GES zemini","ges.iklim":"Toz / rüzgâr","ges.guvenli":"Panel güvenliği",
 "cevre.yol":"Yol","cevre.vinc":"Vinç erişimi","cevre.tuz":"Tuz / korozyon","cevre.risk":"Sel / kum fırtınası riski","cevre.guvenlik":"Güvenlik","cevre.kisi":"Görüşülen kişiler"};
const V1_GROUP={"genel":["genel",""],"harita":["harita",""],"alan-oda":["salon",""],"alan-bosalan":["salonBos",""],"alan-bosoda":["oda",""],"sogutma-dis":["sogutma","Klima dış ünitesi"],"sogutma":["sogutma",""],
 "sebeke":["genel","Şebeke"],"mevcut":["genel","Mevcut altyapı"],"mevcut-dc":["genel","Doğrultucu / akü"],"alan":["genel","Saha alanı"],"sogutma-aku":["genel","Akü yeri"],"ges":["genel","Güneş paneli"],"ges-cati":["genel","Çatı"],"cevre":["genel","Erişim ve çevre"],"foto":["genel",""]};
function convertV1(o){
  const I=o.items||{},it=k=>I[k]||{},ans=k=>{const a=it(k).a;return a==="yes"||a==="no"||a==="unk"?a:""};
  const s={id:"v1-"+o.id,imported:true,name:o.name||"",type:/i[pt]{2}c/i.test((o.name||"")+" "+(o.desc||""))?"itpc":"",gov:o.gov||o.place||"",coord:o.coord||"",contact:o.contact||"",date:o.date||today(),
    a:{},v:{},n:{},photos:{},gens:[],load:{on:false,dcA:"25",hours:"10",batType:"Lityum",batt:"300",coolMode:"auto",acType:"split",btu:"18000"},summary:"",summaryEdited:false,createdAt:o.createdAt||Date.now(),updatedAt:Date.now()};
  const map=[["alan.oda","salon"],["alan.bosalan","salonBos"],["alan.bosoda","oda"],["sebeke.direk","direk"],["sebeke.trafo","trafo"]];
  for(const [o1,k] of map){if(ans(o1))s.a[k]=ans(o1);if(it(o1).n)s.n[k]=it(o1).n}
  if(it("sebeke.direk").v?.mesafe)s.v["direk.m"]=it("sebeke.direk").v.mesafe;
  const sa=num(it("sebeke.saat").v?.saat);
  if(sa!=null&&sa<=24){s.a.kesinti=String(24-sa);s.n.kesinti=appendNote(it("sebeke.saat").n,`Eski kayıttan: günde ~${fmt(sa)} saat elektrik var bilgisinden hesaplandı`)}
  else if(it("sebeke.saat").n)s.n.kesinti=it("sebeke.saat").n;
  const j=it("mevcut.jen");
  if(ans("mevcut.jen")){s.a.jen=ans("mevcut.jen");if(j.n)s.n.jen=j.n;
    if(s.a.jen==="yes"&&j.v&&(j.v.kva||j.v.cap)){const cap=num(j.v.cap),used=num(j.v.used);
      s.gens.push({id:uid(),kva:j.v.kva||"",pct:cap&&used!=null?String(Math.round(used/cap*100)):"",role:"Asıl",
        note:[j.v.sahip,j.v.saat?`günde ~${j.v.saat} saat çalışıyor`:"",cap?`toplam ${cap} A, kullanılan ${used??"?"} A`:""].filter(Boolean).join(" · ")})}}
  const extra=[];
  if(o.desc)extra.push(`Saha tanımı: ${o.desc}`);
  for(const [k,label] of Object.entries(V1_LABEL)){if(["alan.oda","alan.bosalan","alan.bosoda","sebeke.direk","sebeke.trafo","sebeke.saat","mevcut.jen"].includes(k))continue;
    const e=it(k);const a=ans(k),vals=Object.entries(e.v||{}).filter(([,x])=>String(x).trim()).map(([kk,x])=>kk==="tip"||kk==="ad"?String(x):`${({mesafe:"mesafe",kva:"güç (kVA)",en:"en",boy:"boy",saat:"saat",adet:"adet"})[kk]||kk} ${x}`);
    if(!a&&!vals.length&&!e.n)continue;
    extra.push(`${label}: ${[a?({yes:"Evet",no:"Hayır",unk:"Bilinmiyor"})[a]:"",vals.join(", "),e.n].filter(Boolean).join(" – ")}`)}
  if(o.general)extra.push(o.general);
  if(extra.length)s.genNote=["Eski sürümden aktarılan bilgiler:",...extra].join("\n");
  return s;
}
async function importV1(data,photoSrc){
  let n=0,ph=0;
  for(const o of Object.values(data||{})){
    if(!o||!o.id||surveys["v1-"+o.id])continue;
    const s=convertV1(o);
    for(const [g,arr] of Object.entries(o.photos||{})){
      let [tg,label]=V1_GROUP[g]||["genel",V1_LABEL[g.replace("-",".")]||""];
      if(g==="mevcut-jen"){if(s.gens[0])tg="gen-"+s.gens[0].id;else{tg="genel";label="Jeneratör"}}
      for(const p of arr||[]){try{const b=await photoSrc(p.id);if(!b)continue;await idbPut(p.id,b);(s.photos[tg]=s.photos[tg]||[]).push({id:p.id,cap:label});ph++}catch(e){}}
    }
    surveys[s.id]=s;n++;
  }
  saveAll();return{n,ph};
}
function v1LocalPhoto(id){return new Promise(res=>{try{const r=indexedDB.open("saha-kesif-foto",1);r.onupgradeneeded=()=>{r.transaction.abort();res(null)};r.onerror=()=>res(null);
  r.onsuccess=()=>{try{const t=r.result.transaction("p","readonly").objectStore("p").get(id);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}}}catch(e){res(null)}})}
async function migrateLocal(){
  const old=lsGet("saha-kesif",null);
  const list=Object.values(old||{}).filter(o=>o&&o.id&&!o.example);
  if(!list.length)return null;
  toast("Eski kayıtlar aktarılıyor…",6000);
  return await importV1(Object.fromEntries(list.map(o=>[o.id,o])),v1LocalPhoto);
}
function renderImport(){
  view="import";cur=null;
  app.innerHTML=`<div class="topbar"><button class="btn ghost" id="back" aria-label="Geri">←</button><div class="title"><b>Eski sürümden aktar</b><span>Saha Keşfi 1 kayıtları</span></div></div>
  <section class="panel"><b>1. Yol: Bu telefondan doğrudan</b><span class="hint">Eski uygulamanın kayıtları bu uygulamadan okunabiliyorsa tek dokunuşla aktarılır.</span><div class="row"><button class="btn primary" id="imLocal">Eski kayıtları ara ve aktar</button></div><div id="imRes" class="hint"></div></section>
  <section class="panel"><b>2. Yol: Yedek dosyasıyla (her zaman çalışır)</b>
   <ol style="margin:0;padding-left:20px;display:grid;gap:4px"><li>Eski uygulamayı (Saha Keşfi) aç, ana ekranın altındaki <b>Yedek al</b>'a bas.</li><li>Paylaş menüsünden <b>Dosyalara Kaydet</b>'i seç.</li><li>Buraya dön ve aşağıdaki düğmeyle o dosyayı seç.</li></ol>
   <div class="row"><label class="btn primary upload" for="imFile">Eski yedek dosyasını seç<input type="file" id="imFile" accept=".json,application/json"></label></div></section>
  <p class="hint">Aktarılan kayıtlarda saha tipi (İTPC / yeni TT) seçilmemiş olabilir; her kaydı açıp tipini seç. Yeni sistemde karşılığı olmayan cevaplar “Genel not” bölümüne eklenir. Aynı kayıt iki kez aktarılmaz.</p>`;
  app.querySelector("#back").onclick=renderList;
  app.querySelector("#imLocal").onclick=async()=>{const r=await migrateLocal();const out=app.querySelector("#imRes");
    if(!r){out.textContent="Bu uygulamadan eski kayıtlar görünmüyor (iPhone her ana ekran uygulamasının verisini ayrı tutar). 2. yolu kullan.";return}
    out.textContent=r.n?`${r.n} keşif ve ${r.ph} fotoğraf aktarıldı.`:"Yeni aktarılacak kayıt yok (hepsi daha önce aktarılmış).";if(r.n)toast(`${r.n} keşif aktarıldı`)};
  app.querySelector("#imFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    try{const d=JSON.parse(await f.text());if(d.app!=="saha-kesif")throw 0;toast("Aktarılıyor…",6000);
      const r=await importV1(d.surveys,async id=>{const u=d.photos?.[id];return u?await (await fetch(u)).blob():null});
      toast(r.n?`${r.n} keşif ve ${r.ph} fotoğraf aktarıldı`:"Yeni aktarılacak kayıt yok");if(r.n)renderList()}
    catch(err){toast("Bu dosya eski Saha Keşfi yedeği değil")}};
}
function init(){
  app.addEventListener("input",onInput);app.addEventListener("change",onInput);app.addEventListener("click",onClick);
  surveys=lsGet("sk2-surveys",{});prefs=lsGet("sk2-prefs",{});
  try{navigator.storage?.persist?.()}catch(e){}
  addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
  renderList();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;const u=document.getElementById("upd");u.hidden=false;document.getElementById("updGo").onclick=()=>{flush();location.reload()};document.getElementById("updX").onclick=()=>u.hidden=true});
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  }
}
init();
