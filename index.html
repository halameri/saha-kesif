<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Saha Keşfi</title>
<style>
/* Layout: single-column field tool, sticky site bar, collapsible sections, large tap targets for outdoor use */
:root{
  --bg:#e9edf0; --surface:#ffffff; --sunk:#f3f5f7; --ink:#13202a; --muted:#566673; --line:#cfd7dd;
  --accent:#e09b12; --accent-ink:#1b1403; --accent-soft:#fbf0d6;
  --ok:#1d7f47; --ok-soft:#dff1e6; --bad:#b93a24; --bad-soft:#f8e1dc; --na:#6c7a86; --na-soft:#e6eaed;
  --display:system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#172129; --sunk:#111a20; --ink:#e4ebf0; --muted:#94a4b0; --line:#2a3842;
  --accent:#f0b12e; --accent-ink:#1b1403; --accent-soft:#3a2d10;
  --ok:#4cc17e; --ok-soft:#173826; --bad:#f07a62; --bad-soft:#40201a; --na:#9aa8b3; --na-soft:#26323a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#172129; --sunk:#111a20; --ink:#e4ebf0; --muted:#94a4b0; --line:#2a3842;
  --accent:#f0b12e; --accent-ink:#1b1403; --accent-soft:#3a2d10;
  --ok:#4cc17e; --ok-soft:#173826; --bad:#f07a62; --bad-soft:#40201a; --na:#9aa8b3; --na-soft:#26323a; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* list view */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 16px;border-bottom:3px solid var(--ink);margin-bottom:16px;flex-wrap:wrap}
.masthead h1{font-size:2rem;line-height:1;text-transform:uppercase}
.masthead small{display:block;font-family:var(--display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.store-note{font-size:.85rem;color:var(--muted);margin:-6px 0 14px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.card h3{font-size:1.3rem}
.card .meta{font-size:.9rem;color:var(--muted);grid-column:1}
.card .side{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bar{height:6px;background:var(--na-soft);border-radius:3px;overflow:hidden;grid-column:1/-1;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mid{background:var(--accent-soft);color:var(--ink)} .p-none{background:var(--na-soft);color:var(--na)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}

/* editor */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-family:var(--display);font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title span{font-size:.8rem;color:var(--muted)}
.saved{font-size:.8rem;color:var(--muted);white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
label.f input,label.f select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:44px;color:var(--ink);width:100%;font-size:16px}
textarea{min-height:64px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{flex:1;font-size:1.35rem;text-transform:uppercase}
details.sec>summary .sn{font-family:var(--mono);font-size:.8rem;color:var(--muted);width:1.6em}
details.sec>summary .chev{transition:transform .15s;color:var(--muted)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.counts{display:flex;gap:4px}
.counts span{font-family:var(--mono);font-size:.75rem;padding:2px 6px;border-radius:4px}
.items{display:grid}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px;border-left:4px solid transparent}
.item[data-s="ok"]{border-left-color:var(--ok)} .item[data-s="bad"]{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 45%,transparent)} .item[data-s="na"]{border-left-color:var(--na)}
.item .q{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:6px;min-height:42px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"].s-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].s-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"].s-na{background:var(--na);border-color:var(--na);color:var(--bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.calc{font-size:.9rem;background:var(--accent-soft);border-radius:6px;padding:6px 10px}
.calc:empty{display:none}
.note-toggle{justify-self:start;font-size:.85rem;color:var(--muted);background:none;border:none;padding:4px 0;text-decoration:underline}
.secfoot{padding:14px;display:grid;gap:10px;background:var(--sunk)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;max-width:100%}
.photos figure button{position:absolute;top:4px;right:4px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:30px;height:30px;line-height:1;padding:0}
.upload{display:inline-flex;align-items:center;gap:8px}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.problems{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.problems li{background:var(--bad-soft);border-radius:6px;padding:8px 10px;font-size:.92rem}
.problems li b{font-family:var(--display);text-transform:uppercase;font-size:.8rem;letter-spacing:.06em;color:var(--bad);display:block}
pre.report{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;max-height:300px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px;display:grid;gap:8px}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.chip{display:grid;gap:1px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--na);background:var(--sunk);border-radius:8px;padding:8px 10px;min-height:44px}
.chip b{font-family:var(--display);font-size:1.05rem}.chip span{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip i{font-style:normal;font-size:.72rem;font-weight:600;color:var(--muted)}
.chip.k-prog{border-left-color:var(--accent)}.chip.k-sartli{border-left-color:var(--accent);background:var(--accent-soft)}.chip.k-uygun{border-left-color:var(--ok);background:var(--ok-soft)}.chip.k-degil{border-left-color:var(--bad);background:var(--bad-soft)}
.chip.k-uygun i{color:var(--ok)}.chip.k-degil i{color:var(--bad)}
.langseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langseg button{border:0;background:var(--sunk);padding:8px 12px;min-height:38px;font-weight:600;font-size:.9rem}
.langseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.checks{display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.chk span{display:grid;gap:2px;min-width:0}.chk small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap" id="app"><p class="muted">Yükleniyor…</p></div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in"><b id="shName"></b><span class="hint">Açılan menüden “Dosyalara Kaydet”, WhatsApp veya Mail seçebilirsiniz.</span><div class="row"><button class="btn primary" id="shGo">Paylaş / Kaydet</button><button class="btn" id="shX">Kapat</button></div></div></div>
<div class="sheet" id="upd" hidden><div class="sheet-in"><b>Uygulamanın yeni sürümü hazır</b><div class="row"><button class="btn primary" id="updGo">Yenile</button><button class="btn" id="updX">Sonra</button></div></div></div>

<script>
/* ---------- checklist definition (tr + en for reports) ---------- */
const SECTIONS=[
 {id:"sebeke",t:"Şebeke enerjisi",en:"Grid power",items:[
  {id:"direk",q:"En yakın elektrik direği",en:"Nearest power pole",f:[{k:"tip",l:"Tip",le:"Type",type:"sel",o:["AG","OG"],oe:["LV","MV"]},{k:"mesafe",l:"Mesafe",le:"Distance",u:"m"}]},
  {id:"trafo",q:"Yakında trafo",en:"Nearby transformer",f:[{k:"guc",l:"Gücü",le:"Rating",u:"kVA"},{k:"mesafe",l:"Mesafe",le:"Distance",u:"m"}]},
  {id:"baglanti",q:"Bağlantı tipi belirlendi",en:"Connection type defined",f:[{k:"tip",l:"Tip",le:"Type",type:"sel",o:["AG monofaze","AG trifaze","OG + yeni trafo"],oe:["LV single-phase","LV three-phase","MV + new transformer"]}]},
  {id:"guzergah",q:"Hat güzergâhı uygun (özel arazi / yol geçişi sorunu yok)",en:"Line route clear (no private land / road crossing issues)"},
  {id:"aradirek",q:"Ara direk ihtiyacı",en:"Intermediate poles required",f:[{k:"adet",l:"Adet",le:"Qty"}]},
  {id:"kesinti",q:"Bölgede kesinti sıklığı makul",en:"Grid outage frequency acceptable",hint:"Yerel halka ve yakındaki tesislere sorun"},
  {id:"sayac",q:"Sayaç ve ana pano yeri belirlendi",en:"Meter and main panel location defined"},
  {id:"dagitim",q:"Elektrik dağıtım kurumu",en:"Electricity distribution authority",f:[{k:"ad",l:"Kurum",le:"Authority",type:"text"}]}]},
 {id:"konteyner",t:"Konteyner / kabinet alanı",en:"Container / cabinet area",items:[
  {id:"olcu",q:"Konteyner alanı ölçüsü",en:"Container area",f:[{k:"en",l:"En",le:"Width",u:"m"},{k:"boy",l:"Boy",le:"Length",u:"m"}],area:1},
  {id:"duz",q:"Zemin düz veya az eğimli",en:"Ground level or slight slope"},
  {id:"zemin",q:"Zemin tipi",en:"Ground type",f:[{k:"tip",l:"Tip",le:"Type",type:"sel",o:["Kaya","Toprak","Kum","Dolgu","Karışık"],oe:["Rock","Soil","Sand","Fill","Mixed"]}]},
  {id:"drenaj",q:"Su birikmesi / sel riski yok",en:"No water pooling / flood risk"},
  {id:"kapi",q:"Kapı önünde bakım boşluğu var",en:"Maintenance clearance in front of door"}]},
 {id:"jenerator",t:"Jeneratör",en:"Generator",items:[
  {id:"alan",q:"Jeneratör + kaide alanı (bakım boşluğu dahil)",en:"Generator + plinth area (incl. clearance)",f:[{k:"en",l:"En",le:"Width",u:"m"},{k:"boy",l:"Boy",le:"Length",u:"m"}],area:1},
  {id:"tank",q:"Yakıt tankı için alan var",en:"Space for fuel tank"},
  {id:"egzoz",q:"Egzoz yönü uygun (konteynere / klimaya / yerleşime bakmıyor)",en:"Exhaust direction acceptable"},
  {id:"yerlesim",q:"Yerleşim yerine mesafe yeterli",en:"Sufficient distance to houses",f:[{k:"mesafe",l:"Mesafe",le:"Distance",u:"m"}]},
  {id:"ikmal",q:"Yakıt ikmal aracı yanaşabiliyor (her mevsim)",en:"Fuel truck access (all seasons)"}]},
 {id:"ges",t:"GES uygunluğu",en:"Solar (PV) suitability",items:[
  {id:"golge",q:"Gölgeleme yok (tepe, ağaç, bina)",en:"No shading (hills, trees, buildings)"},
  {id:"kulegolge",q:"Kulenin gölgesi panel alanına düşmüyor",en:"Tower shadow does not fall on PV area"},
  {id:"guney",q:"Güney yönü açık",en:"South side open"},
  {id:"alan",q:"Kullanılabilir GES alanı",en:"Usable PV area",f:[{k:"en",l:"En",le:"Width",u:"m"},{k:"boy",l:"Boy",le:"Length",u:"m"}],area:1,kwp:1},
  {id:"zemin",q:"Zemin konstrüksiyona uygun",en:"Ground suitable for PV structure"},
  {id:"iklim",q:"Toz / rüzgâr yükü kabul edilebilir (panel temizliği)",en:"Dust / wind load acceptable (panel cleaning)"},
  {id:"guvenlik",q:"Paneller duvar içinde, hırsızlık riski düşük",en:"Panels inside wall, low theft risk"},
  {id:"cati",q:"Konteyner çatısı alternatif olarak kullanılabilir",en:"Container roof usable as alternative"}]},
 {id:"duvar",t:"Çevre duvarı / çit",en:"Boundary wall / fence",items:[
  {id:"sinir",q:"Duvar sınırı ölçüsü",en:"Compound (wall) dimensions",f:[{k:"en",l:"En",le:"Width",u:"m"},{k:"boy",l:"Boy",le:"Length",u:"m"}],area:1},
  {id:"sigiyor",q:"Kule + konteyner + jeneratör + tank (+ GES) içeri sığıyor",en:"Tower + container + generator + tank (+ PV) fit inside"},
  {id:"bosluk",q:"Ekipman ile duvar arası boşluk yeterli",en:"Clearance between equipment and wall"},
  {id:"kapi",q:"Giriş kapısı vinç / kamyon için yeterli",en:"Gate wide enough for crane / truck",f:[{k:"genislik",l:"Genişlik",le:"Width",u:"m"}]},
  {id:"parsel",q:"Parsel sınırı uyumlu, komşu sorunu yok",en:"Plot boundary OK, no neighbour issues"},
  {id:"yedek",q:"Gelecek genişleme için yedek alan var",en:"Spare space for future expansion"}]},
 {id:"topraklama",t:"Topraklama ve yıldırım",en:"Earthing and lightning",items:[
  {id:"zemin",q:"Zemin topraklamaya uygun",en:"Ground suitable for earthing",f:[{k:"tip",l:"Tip",le:"Type",type:"sel",o:["Toprak","Kaya","Kum","Karışık"],oe:["Soil","Rock","Sand","Mixed"]}]},
  {id:"ozdirenc",q:"Toprak özdirenç ölçümü",en:"Soil resistivity measurement",f:[{k:"deger",l:"Değer",le:"Value",u:"Ω·m"}]},
  {id:"ag",q:"Topraklama ağı için alan var",en:"Space for earthing grid"},
  {id:"yildirim",q:"Yıldırım riski düşük",en:"Low lightning risk"}]},
 {id:"batarya",t:"Batarya ve iklimlendirme",en:"Batteries and cooling",items:[
  {id:"yedek",q:"Hedef yedekleme süresi belirlendi",en:"Target backup time defined",f:[{k:"saat",l:"Süre",le:"Duration",u:"saat",ue:"h"}]},
  {id:"sicaklik",q:"Bölge sıcaklık aralığı",en:"Site temperature range",f:[{k:"min",l:"Min",le:"Min",u:"°C"},{k:"max",l:"Maks",le:"Max",u:"°C"}]},
  {id:"klima",q:"Klima ihtiyacı değerlendirildi",en:"Cooling (AC) need assessed"},
  {id:"gunes",q:"Konteyner doğrudan güneşe maruz değil",en:"Container not in direct sun"}]},
 {id:"erisim",t:"Erişim ve çevresel riskler",en:"Access and environmental risks",items:[
  {id:"yol",q:"Yol durumu",en:"Road condition",f:[{k:"tip",l:"Yol",le:"Road",type:"sel",o:["Asfalt","Stabilize","Toprak","Yol yok"],oe:["Asphalt","Gravel","Dirt","No road"]}]},
  {id:"kis",q:"Yol tüm yıl açık (yağmur / çamur)",en:"Road open all year (rain / mud)"},
  {id:"vinc",q:"Vinç / ağır araç erişimi var",en:"Crane / heavy vehicle access"},
  {id:"risk",q:"Sel / kum fırtınası / heyelan riski yok",en:"No flood / sandstorm / landslide risk"},
  {id:"tuz",q:"Tuzlu hava / korozyon riski değerlendirildi",en:"Salt air / corrosion risk assessed",hint:"Deniz veya tuzla yakınındaki sahalarda önemli"},
  {id:"kisi",q:"Görüşülen kişiler",en:"People met on site",f:[{k:"ad",l:"Kişiler",le:"People",type:"text"}]}]}
];
const TOTAL=SECTIONS.reduce((a,s)=>a+s.items.length,0);
const VERDICTS={"":"Değerlendirilmedi",uygun:"Uygun",sartli:"Şartlı uygun",degil:"Uygun değil"};
const VERDICTS_EN={"":"Not assessed",uygun:"Suitable",sartli:"Conditionally suitable",degil:"Not suitable"};
const ST={ok:"✓ Uygun",bad:"✕ Sorunlu",na:"– Yok / N/A"};
const DEFAULT_SITES=[...Array(10)].map((_,i)=>({id:"ila"+i,name:"ILA "+i,gov:i===1?"Basra (AlFaw)":"",gps:"",purpose:"",contact:""}));

let surveys={},sites=[],prefs={},daily={},openId=null,cur=null,saveT=null,view="list";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Telefon hafızası dolu olabilir")}}
const lsSave=()=>lsSet("saha-kesif",surveys);
const saveSites=()=>lsSet("saha-sites",sites);
const savePrefs=()=>lsSet("saha-prefs",prefs);
const saveDaily=()=>lsSet("saha-daily",daily);

function stats(s){let ok=0,bad=0,na=0;for(const sec of SECTIONS)for(const it of sec.items){const v=s.items?.[sec.id+"."+it.id]?.s;if(v==="ok")ok++;else if(v==="bad")bad++;else if(v==="na")na++}return{ok,bad,na,done:ok+bad+na}}
function secStats(s,sec){let ok=0,bad=0,done=0;for(const it of sec.items){const v=s.items?.[sec.id+"."+it.id]?.s;if(v)done++;if(v==="ok")ok++;if(v==="bad")bad++}return{ok,bad,done}}
const num=x=>parseFloat(String(x||"").replace(",","."));
function areaOf(e){const a=num(e?.en),b=num(e?.boy);return a>0&&b>0?a*b:null}
function fmt(n,d=1,lang="tr"){return n.toLocaleString(lang==="en"?"en-GB":"tr-TR",{maximumFractionDigits:d})}
function parseCoord(c){const m=String(c||"").match(/(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/);if(!m)return null;const la=parseFloat(m[1].replace(",",".")),lo=parseFloat(m[2].replace(",","."));return Math.abs(la)<=90&&Math.abs(lo)<=180?[la,lo]:null}
function verdictPill(v){const c={uygun:"p-ok",sartli:"p-mid",degil:"p-bad"}[v]||"p-none";return `<span class="pill ${c}">${VERDICTS[v||""]}</span>`}
function fmtDate(d,lang){if(!d)return "-";const [y,m,dd]=d.split("-");return lang==="en"?new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):`${dd}.${m}.${y}`}
const siteOf=s=>sites.find(x=>norm(x.name)===norm(s.name));
const govOf=s=>s.gov||s.place||siteOf(s)?.gov||"";
function surveysFor(site){return Object.values(surveys).filter(s=>norm(s.name)===norm(site.name)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
function siteStatus(site){const l=surveysFor(site);if(!l.length)return{k:"none",t:"Gidilmedi",s:null};const s=l[0];if(s.verdict)return{k:s.verdict,t:VERDICTS[s.verdict],s};return{k:"prog",t:"Devam ediyor",s}}

  app.innerHTML=`

  app.querySelector("#imp").onclick=()=>{const n=importSites(app.querySelector("#paste").value);toast(n?`${n} saha eklendi / güncellendi`:"Satır bulunamadı; sütunları sekme ile ayrılmış yapıştırın");if(n)renderSites()};

function nextIla(){let m=-1;for(const s of sites){const x=String(s.name).match(/^ILA\s*(\d+)$/i);if(x)m=Math.max(m,+x[1])}return "ILA "+(m+1)}
function siteRow(x){const st=siteStatus(x);return `<div class="panel" data-sid="${esc(x.id)}" style="margin:0">
  <div class="row" style="justify-content:space-between"><span class="pill ${({none:"p-none",prog:"p-mid",uygun:"p-ok",sartli:"p-mid",degil:"p-bad"})[st.k]}">${st.t}</span><button class="btn ghost danger" data-delsite="${esc(x.id)}" style="min-height:36px">Sil</button></div>
  <div class="grid2">
   <label class="f" for="sn-${x.id}">Site name<input id="sn-${x.id}" data-sf="name" value="${esc(x.name)}"></label>
   <label class="f" for="sg-${x.id}">Governorate<input id="sg-${x.id}" data-sf="gov" value="${esc(x.gov)}"></label>
  </div>
  <label class="f" for="sp-${x.id}">GPS coordinates<input id="sp-${x.id}" data-sf="gps" class="num" value="${esc(x.gps)}"></label>
  <label class="f" for="su-${x.id}">Purpose of inspection<input id="su-${x.id}" data-sf="purpose" value="${esc(x.purpose)}"></label>
  <label class="f" for="sc-${x.id}">Local contact (name, title, mobile)<input id="sc-${x.id}" data-sf="contact" value="${esc(x.contact)}"></label>
 </div>`}
function importSites(text){
  let n=0;
  for(const raw of String(text).split(/\r?\n/)){
    if(!raw.trim())continue;
    let c=raw.includes("\t")?raw.split("\t"):raw.includes(";")?raw.split(";"):raw.split(/\s{2,}/);
    c=c.map(x=>x.trim());
    if(/^\d+\.?$/.test(c[0]))c.shift();
    while(c.length&&!c[0])c.shift();
    if(!c[0]||/^site\s*name/i.test(c[0]))continue;
    const [name,gov="",gps="",purpose="",...rest]=c;const contact=rest.filter(Boolean).join(", ");
    let s=sites.find(x=>norm(x.name)===norm(name));
    if(!s){s={id:uid(),name,gov:"",gps:"",purpose:"",contact:""};sites.push(s)}
    if(gov)s.gov=gov;if(gps)s.gps=gps;if(purpose)s.purpose=purpose;if(contact)s.contact=contact;n++;
  }
  sites.sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr",{numeric:true}));saveSites();return n;
}

function fieldHtml(key,f,val){

  if(f.type==="sel")return `<label class="f" for="${id}">${f.l}<select id="${id}" data-k="${key}" data-f="${f.k}"><option value="">Seçin</option>${f.o.map(o=>`<option${val===o?" selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const isNum=f.type!=="text";
  return `<label class="f" for="${id}">${f.l}${f.u?` (${f.u})`:""}<input id="${id}" data-k="${key}" data-f="${f.k}" ${isNum?'inputmode="decimal" class="num"':''} value="${esc(val)}" autocomplete="off"></label>`;
}
function calcText(it,v,lang="tr"){
  if(!it.area)return "";const a=areaOf(v);if(!a)return "";
  let t=`= ${fmt(a,1,lang)} m²`;if(it.kwp)t+=lang==="en"?` · approx. ${fmt(a/7,1,lang)} kWp ground-mounted`:` · yerden montajda yaklaşık ${fmt(a/7)} kWp (≈7 m²/kWp)`;return t;
}

function onInput(e){
  const el=e.target;
  if(view==="sites"&&el.dataset.sf){const row=el.closest("[data-sid]"),x=sites.find(s=>s.id===row.dataset.sid);if(x){x[el.dataset.sf]=el.value;saveSites()}return}
  if(view==="daily"){dailyInput(e);return}
  if(!cur)return;
  if(el.dataset.m){cur[el.dataset.m]=el.value;const m=el.dataset.m;
    if(m==="name"){app.querySelector("#tName").textContent=el.value||"Adsız saha";const site=siteOf(cur);if(site&&e.type==="change")fillFromSite(site)}
    if(m==="coord")app.querySelector("#coordHint").innerHTML=coordHint(parseCoord(el.value));
    if(m==="team"){prefs.team=el.value;savePrefs()}
    dirty();return}
  if(el.dataset.k){const key=el.dataset.k,e2=cur.items[key]||(cur.items[key]={});e2.v=e2.v||{};e2.v[el.dataset.f]=el.value;
    const [sid,iid]=key.split("."),it=SECTIONS.find(s=>s.id===sid).items.find(i=>i.id===iid);
    if(it.area){app.querySelector("#calc-"+key.replace(".","-")).textContent=calcText(it,e2.v)}dirty();return}
  if(el.dataset.note){(cur.items[el.dataset.note]||(cur.items[el.dataset.note]={})).n=el.value;dirty();if(e.type==="change")updateProblems();return}
  if(el.dataset.secnote){cur.secNotes=cur.secNotes||{};cur.secNotes[el.dataset.secnote]=el.value;dirty();return}
  if(el.dataset.up&&e.type==="change"){uploadPhotos(el.dataset.up,[...el.files]);el.value=""}
}
function fillFromSite(site){
  const map={gov:"gov",coord:"gps",purpose:"purpose",contact:"contact"};let n=0;
  for(const [k,sk] of Object.entries(map)){if(!cur[k]&&site[sk]){cur[k]=site[sk];const inp=app.querySelector("#m-"+k);if(inp)inp.value=site[sk];n++}}
  if(n){app.querySelector("#coordHint").innerHTML=coordHint(parseCoord(cur.coord));toast("Saha bilgileri listeden dolduruldu")}
}
function onClick(e){
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){prefs.lang=b.dataset.lang;savePrefs();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===prefs.lang));
    if(view==="daily")updateDailyPreview();else{const r=app.querySelector("#report");if(r&&!r.hidden)r.textContent=reportText(cur,prefs.lang)}return}
  if(view==="sites"&&b.dataset.delsite){if(b.dataset.armed){sites=sites.filter(x=>x.id!==b.dataset.delsite);saveSites();renderSites();toast("Saha listeden silindi (keşif kayıtları duruyor)")}else{b.dataset.armed="1";b.textContent="Silinsin mi? Tekrar dokun";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Sil"}},3000)}return}
  if(!cur)return;
  if(b.dataset.st){const item=b.closest(".item"),key=item.dataset.key,e2=cur.items[key]||(cur.items[key]={});
    e2.s=e2.s===b.dataset.st?"":b.dataset.st;item.dataset.s=e2.s;
    item.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.st===e2.s));
    if(e2.s==="bad"&&!e2.n){const t=item.querySelector("[data-addnote]");if(t)t.click()}
    updateProgress();updateProblems();dirty();return}
  if(b.dataset.addnote){const key=b.dataset.addnote,ta=document.createElement("textarea");ta.id="n-"+key.replace(".","-");ta.dataset.note=key;ta.placeholder="Not (sorunu kısaca yazın)";b.replaceWith(ta);ta.focus();return}
  if(b.dataset.rmph){const arr=cur.photos[b.dataset.rmph];const [gone]=arr.splice(+b.dataset.i,1);if(gone)idbDel(gone.id);app.querySelector("#ph-"+b.dataset.rmph).innerHTML=photosHtml(b.dataset.rmph);hydrate();dirty()}
}
function updateProgress(){
  const st=stats(cur);app.querySelector("#tProg").textContent=`${st.done}/${TOTAL} madde · ${st.bad} sorun`;
  for(const sec of SECTIONS){const x=secStats(cur,sec);app.querySelector("#c-"+sec.id).innerHTML=`${x.bad?`<span class="p-bad">${x.bad}✕</span>`:""}<span class="${x.done===sec.items.length?"p-ok":"p-none"}">${x.done}/${sec.items.length}</span>`}
}
function issues(s,lang){const out=[];for(const sec of SECTIONS)for(const it of sec.items){const e=s.items?.[sec.id+"."+it.id];if(e?.s==="bad")out.push({sec:lang==="en"?sec.en:sec.t,q:lang==="en"?it.en:it.q,n:e.n||""})}return out}
function updateProblems(){
  const ul=app.querySelector("#problems");
  ul.innerHTML=issues(cur,"tr").map(p=>`<li><b>${esc(p.sec)}</b>${esc(p.q)}${p.n?` — ${esc(p.n)}`:""}</li>`).join("")||`<li style="background:var(--ok-soft)">Sorunlu madde yok.</li>`;
}
async function uploadPhotos(secId,files){
  for(const f of files){
    try{toast("Fotoğraf kaydediliyor…");const blob=await shrink(f);const id=uid();await idbPut(id,blob);urlCache[id]=URL.createObjectURL(blob);
      (cur.photos[secId]=cur.photos[secId]||[]).push({id});app.querySelector("#ph-"+secId).innerHTML=photosHtml(secId);hydrate();dirty();toast("Fotoğraf eklendi")}
    catch(e){toast("Fotoğraf kaydedilemedi (telefon hafızası dolu olabilir)")}
  }
}
function shrink(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.8)};img.onerror=()=>res(file);img.src=u})}

/* ---------- report text ---------- */
const V=(s,key,k)=>String(s.items?.[key]?.v?.[k]||"").trim();
const S=(s,key)=>s.items?.[key]?.s||"";
function optLabel(key,k,val,lang){if(lang!=="en"||!val)return val;const [a,b]=key.split(".");const f=SECTIONS.find(x=>x.id===a).items.find(x=>x.id===b).f.find(x=>x.k===k);if(!f.oe)return val;const i=f.o.indexOf(val);return i>=0?f.oe[i]:val}
function energyLines(s,lang){
  const en=lang==="en",out=[],F=n=>fmt(n,1,lang);
  const g=[];const dT=optLabel("sebeke.direk","tip",V(s,"sebeke.direk","tip"),lang),dM=V(s,"sebeke.direk","mesafe");
  if(S(s,"sebeke.direk")==="na")g.push(en?"no power pole nearby":"yakında direk yok");
  else if(dT||dM)g.push(en?`${dT?dT+" ":""}pole${dM?` at ${dM} m`:""}`:`${dT?dT+" ":""}direk${dM?` ${dM} m`:""}`);
  const tG=V(s,"sebeke.trafo","guc"),tM=V(s,"sebeke.trafo","mesafe");
  if(S(s,"sebeke.trafo")==="na")g.push(en?"no transformer nearby":"yakında trafo yok");
  else if(tG||tM)g.push(en?`transformer${tG?` ${tG} kVA`:""}${tM?` at ${tM} m`:""}`:`trafo${tG?` ${tG} kVA`:""}${tM?` ${tM} m`:""}`);
  const bT=optLabel("sebeke.baglanti","tip",V(s,"sebeke.baglanti","tip"),lang);if(bT)g.push(en?`connection: ${bT}`:`bağlantı: ${bT}`);
  if(g.length)out.push((en?"Grid: ":"Şebeke: ")+g.join(" · "));
  const j=[];const jA=areaOf(s.items?.["jenerator.alan"]?.v);if(jA)j.push(`${F(jA)} m²`);
  if(S(s,"jenerator.alan")==="bad")j.push(en?"insufficient space":"alan yetersiz");else if(S(s,"jenerator.alan")==="ok"&&!jA)j.push(en?"space available":"alan var");
  if(S(s,"jenerator.ikmal")==="bad")j.push(en?"fuel access issue":"yakıt ikmal sorunu");
  if(j.length)out.push((en?"Generator: ":"Jeneratör: ")+j.join(" · "));
  const p=[];const pA=areaOf(s.items?.["ges.alan"]?.v);if(pA)p.push(`${F(pA)} m² (~${F(pA/7)} kWp)`);
  if(S(s,"ges.golge")==="bad"||S(s,"ges.kulegolge")==="bad")p.push(en?"shading issue":"gölge sorunu");
  else if(S(s,"ges.golge")==="ok")p.push(en?"no shading":"gölge yok");
  if(S(s,"ges.alan")==="bad")p.push(en?"area not sufficient":"alan yetersiz");
  if(p.length)out.push((en?"Solar: ":"GES: ")+p.join(" · "));
  const w=[];const wA=areaOf(s.items?.["duvar.sinir"]?.v);if(wA)w.push(`${F(wA)} m²`);
  if(S(s,"duvar.sigiyor")==="bad")w.push(en?"equipment does not fit":"ekipman sığmıyor");else if(S(s,"duvar.sigiyor")==="ok")w.push(en?"all equipment fits":"ekipman sığıyor");
  if(w.length)out.push((en?"Compound: ":"Duvar içi: ")+w.join(" · "));
  return out;
}
function siteHeader(s,lang){const g=govOf(s);return `${s.name||(lang==="en"?"Unnamed site":"Adsız saha")}${g?` – ${g}`:""}`}
function reportText(s,lang){
  const en=lang==="en",st=stats(s),L=[];const VD=en?VERDICTS_EN:VERDICTS;
  L.push(en?"SITE SURVEY REPORT – ENERGY":"SAHA KEŞİF RAPORU – ENERJİ","=".repeat(34));
  const row=(a,b)=>L.push(`${a.padEnd(12)}: ${b||"-"}`);
  row(en?"Site":"Saha",s.name);row("Governorate",govOf(s));row(en?"Date":"Tarih",fmtDate(s.date,lang));
  row(en?"Purpose":"Amaç",s.purpose);row(en?"Contact":"İrtibat",s.contact);row(en?"Team":"Ekip",s.team);
  const c=parseCoord(s.coord);row("GPS",c?`${c[0]}, ${c[1]}  https://maps.google.com/?q=${c[0]},${c[1]}`:"");
  row(en?"Result":"Sonuç",`${VD[s.verdict||""].toLocaleUpperCase(en?"en":"tr")} (${st.done}/${TOTAL} ${en?"checks":"madde"}, ${st.bad} ${en?"issues":"sorun"})`);
  const el=energyLines(s,lang);if(el.length){L.push("");el.forEach(x=>L.push("• "+x))}
  if(s.general)L.push("",(en?"Recommendation: ":"Öneri: ")+s.general);
  SECTIONS.forEach((sec,i)=>{L.push("",`${i+1}. ${(en?sec.en:sec.t).toLocaleUpperCase(en?"en":"tr")}`,"-".repeat(28));
    for(const it of sec.items){const e=s.items?.[sec.id+"."+it.id]||{};const mark={ok:"[✓]",bad:"[✕]",na:"[–]"}[e.s]||"[ ]";
      const vals=(it.f||[]).map(f=>{const raw=e.v?.[f.k];if(!raw)return "";const val=f.type==="sel"?optLabel(sec.id+"."+it.id,f.k,raw,lang):raw;return `${en?f.le:f.l}: ${val}${f.u?" "+(en&&f.ue?f.ue:f.u):""}`}).filter(Boolean);
      if(it.area){const a=areaOf(e.v);if(a)vals.push(`${en?"Area":"Alan"}: ${fmt(a,1,lang)} m²${it.kwp?` (≈${fmt(a/7,1,lang)} kWp)`:""}`)}
      L.push(`${mark} ${en?it.en:it.q}${vals.length?" — "+vals.join(", "):""}${e.n?`\n     ${en?"Note":"Not"}: ${e.n}`:""}`)}
    if(s.secNotes?.[sec.id])L.push("  "+(en?"Section note: ":"Bölüm notu: ")+s.secNotes[sec.id]);
    const ph=s.photos?.[sec.id]?.length;if(ph)L.push(`  ${en?"Photos":"Fotoğraf"}: ${ph}`)});
  const pr=issues(s,lang);L.push("",en?"ISSUES":"SORUNLU MADDELER","-".repeat(28),...(pr.length?pr.map(p=>`• [${p.sec}] ${p.q}${p.n?": "+p.n:""}`):[en?"None":"Yok"]));
  return L.join("\n");
}

function dailyInput(e){
  const el=e.target;

  if(el.id==="d-notes"){daily[dState.date]=el.value;saveDaily()}

${left.length?`<p><b>${en?"Remaining sites":"Kalan sahalar"}:</b> ${esc(left.join(", "))}</p>`:""}
</body></html>`;
  try{await saveFile({filename:`${en?"daily-report":"gunluk-rapor"}_${dState.date}.html`,data:html,type:"text/html"})}catch(e){toast("Dosya hazırlanamadı")}
}

/* ---------- local device storage ---------- */
let idbP=null;const urlCache={};
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("saha-kesif-foto",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("p",mode),st=t.objectStore("p"),r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const idbPut=(id,b)=>idbTx("readwrite",st=>st.put(b,id));
const idbGet=id=>idbTx("readonly",st=>st.get(id));
const idbDel=id=>{delete urlCache[id];return idbTx("readwrite",st=>st.delete(id)).catch(()=>{})};
async function hydrate(){for(const img of app.querySelectorAll("img[data-pid]")){const id=img.dataset.pid;if(!urlCache[id]){try{const b=await idbGet(id);if(b)urlCache[id]=URL.createObjectURL(b)}catch(e){}}if(urlCache[id]&&img.getAttribute("src")!==urlCache[id])img.src=urlCache[id]}}
function anchorSave(b,filename){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function saveFile({filename,data,type}){
  const mime=type||"text/plain",b=data instanceof Blob?data:new Blob([data],{type:mime+";charset=utf-8"});
  let file=null;try{file=new File([b],filename,{type:mime})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    const sh=document.getElementById("sheet");document.getElementById("shName").textContent=filename;sh.hidden=false;
    document.getElementById("shX").onclick=()=>sh.hidden=true;
    document.getElementById("shGo").onclick=()=>{navigator.share({files:[file],title:filename}).then(()=>{sh.hidden=true}).catch(e=>{if(e&&e.name!=="AbortError")anchorSave(b,filename)})};
    return}
  anchorSave(b,filename);toast("Dosya hazır")}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r("");f.readAsDataURL(b)});
const fname=s=>(s.name||"saha").replace(/[^\wğüşıöçĞÜŞİÖÇ-]+/g,"_");

function getGps(){
  if(!navigator.geolocation){toast("Bu tarayıcı konum vermiyor; koordinatı elle yazın");return}
  toast("Konum alınıyor… açık havada daha hızlı");
  navigator.geolocation.getCurrentPosition(p=>{
    if(!cur)return;const c=p.coords;cur.coord=`${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}`;
    app.querySelector("#m-coord").value=cur.coord;
    if(c.altitude!=null){cur.alt=String(Math.round(c.altitude));app.querySelector("#m-alt").value=cur.alt}
    app.querySelector("#coordHint").innerHTML=coordHint(parseCoord(cur.coord))+` · ±${Math.round(c.accuracy)} m`;dirty();toast("Konum alındı")
  },e=>toast(e.code===1?"Konum izni verilmedi: Ayarlar › Gizlilik › Konum Servisleri › Safari Web Siteleri":"Konum alınamadı, tekrar deneyin"),{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}
async function htmlReport(){
  flush();const s=cur,lang=prefs.lang||"tr",en=lang==="en";toast("Rapor hazırlanıyor…");
  let ph="";for(const sec of SECTIONS){const arr=s.photos?.[sec.id]||[];if(!arr.length)continue;let imgs="";
    for(const p of arr){try{const b=await idbGet(p.id);if(b)imgs+=`<img src="${await blobToData(b)}">`}catch(e){}}
    ph+=`<h3>${esc(en?sec.en:sec.t)}</h3><div class="g">${imgs}</div>`}
  const html=`<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(siteHeader(s,lang))}</title><style>body{font-family:system-ui,sans-serif;max-width:820px;margin:0 auto;padding:16px;color:#13202a}pre{white-space:pre-wrap;font-size:13px;background:#f3f5f7;padding:12px;border-radius:6px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.g img{width:100%;border-radius:6px}h3{margin-top:24px}</style></head><body><pre>${esc(reportText(s,lang))}</pre>${ph?`<h2>${en?"Photos":"Fotoğraflar"}</h2>${ph}`:""}</body></html>`;
  try{await saveFile({filename:`${en?"site-report":"kesif"}_${fname(s)}_${s.date||today()}.html`,data:html,type:"text/html"})}catch(e){toast("Dosya kaydedilemedi")}
}
async function backup(){
  toast("Yedek hazırlanıyor…");const photos={};
  for(const s of Object.values(surveys))for(const arr of Object.values(s.photos||{}))for(const p of arr){try{const b=await idbGet(p.id);if(b)photos[p.id]=await blobToData(b)}catch(e){}}
  const data=JSON.stringify({app:"saha-kesif",v:2,at:new Date().toISOString(),surveys,sites,prefs,daily,photos});
  try{await saveFile({filename:`saha-kesif-yedek_${today()}.json`,data,type:"application/json"})}catch(e){toast("Yedek kaydedilemedi")}
}
async function restore(file){
  try{const d=JSON.parse(await file.text());if(d.app!=="saha-kesif")throw 0;
    for(const [id,url] of Object.entries(d.photos||{})){const b=await (await fetch(url)).blob();await idbPut(id,b)}
    let n=0;for(const [id,s] of Object.entries(d.surveys||{})){if(!surveys[id]||(s.updatedAt||0)>(surveys[id].updatedAt||0)){surveys[id]=s;n++}}
    for(const x of d.sites||[])if(!sites.some(y=>norm(y.name)===norm(x.name)))sites.push(x);
    Object.assign(daily,d.daily||{});
    lsSave();saveSites();saveDaily();renderList();toast(`${n} keşif yüklendi`)}
  catch(e){toast("Bu dosya bir saha keşif yedeği değil")}
}

/* ---------- persistence ---------- */
function dirty(){cur.updatedAt=Date.now();const sv=app.querySelector("#saved");if(sv)sv.textContent="Kaydediliyor…";clearTimeout(saveT);saveT=setTimeout(()=>persist(cur),500)}
function flush(){if(saveT&&cur){clearTimeout(saveT);saveT=null;persist(cur)}}
function persist(s){saveT=null;surveys[s.id]=s;lsSave();const sv=app.querySelector("#saved");if(sv&&openId)sv.textContent="Telefona kaydedildi"}
function openSurvey(id){openId=id;cur=surveys[id];cur.items=cur.items||{};cur.photos=cur.photos||{};cur.secNotes=cur.secNotes||{};renderEditor();scrollTo(0,0)}

function init(){
  app.addEventListener("input",onInput);app.addEventListener("change",onInput);app.addEventListener("click",onClick);
  surveys=lsGet("saha-kesif",{});sites=lsGet("saha-sites",null)||DEFAULT_SITES.map(x=>({...x}));prefs=lsGet("saha-prefs",{});daily=lsGet("saha-daily",{});
  if(!localStorage.getItem("saha-sites"))saveSites();
  try{navigator.storage?.persist?.()}catch(e){}
  addEventListener("pagehide",()=>flush());
  document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
  renderList();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;const u=document.getElementById("upd");u.hidden=false;
      document.getElementById("updGo").onclick=()=>{flush();location.reload()};document.getElementById("updX").onclick=()=>u.hidden=true});
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}
init();
</script>
</body></html>
